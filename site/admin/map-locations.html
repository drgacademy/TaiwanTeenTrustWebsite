<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n-title-key="nav.map">TTT Admin — 流浪動物中心</title>
  <link rel="icon" href="../assets/favicon.png" type="image/png" />
  <link rel="stylesheet" href="css/admin.css?v=5" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    #preview-map { height: 200px; border-radius: .4rem; overflow: hidden; margin-top: .5rem; }
    #preview-map { border: 1px solid var(--border); }
    .leaflet-container { background: var(--surface-2); }
    .coord-row { display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap; }
    .coord-row .field { flex: 1 1 140px; margin-bottom: 0; }
    .coord-row .geo-btn { margin-bottom: .1rem; white-space: nowrap; }
    .needs-section { border-top: 1px solid var(--border); padding-top: 1.25rem; margin-top: 1.25rem; }

    /* 預設物資按鈕（點擊加入清單） */
    .preset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: .4rem; margin-bottom: 1rem; }
    .preset-btn {
      padding: .5rem .6rem;
      border: 1px solid var(--border);
      border-radius: .35rem;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font-size: .8rem;
      transition: all .15s;
    }
    .preset-btn:hover { background: var(--surface-2); border-color: var(--accent); }
    .preset-btn.selected { background: var(--surface-2); border-color: var(--accent); color: var(--accent); font-weight: 600; }
    .preset-btn .plus { color: var(--accent); margin-right: .25rem; font-weight: 600; }

    /* 已選擇的物資清單 */
    .selected-list {
      border: 1px solid var(--border);
      border-radius: .4rem;
      padding: .5rem;
      min-height: 60px;
      background: var(--surface-2);
    }
    .selected-empty { color: var(--text-3); font-size: .85rem; text-align: center; padding: 1rem; }
    .selected-row {
      display: flex;
      align-items: center;
      gap: .5rem;
      padding: .55rem .65rem;
      border-radius: .3rem;
    }
    .selected-row + .selected-row { border-top: 1px solid var(--border); margin-top: .25rem; padding-top: .8rem; }
    .selected-row .name { flex: 1; font-size: .9rem; }
    .selected-row .levels { display: flex; gap: .25rem; }
    .selected-row .level-btn {
      padding: .25rem .55rem;
      border: 1px solid var(--border);
      border-radius: .25rem;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font-size: .72rem;
      transition: all .15s;
    }
    .selected-row .level-btn:hover { background: var(--surface-2); }
    .selected-row .level-btn.active.urgent   { background: #fecaca; color: #7f1d1d; border-color: #dc2626; }
    .selected-row .level-btn.active.moderate { background: #fed7aa; color: #7c2d12; border-color: #ea580c; }
    .selected-row .level-btn.active.slight   { background: #fef3c7; color: #78350f; border-color: #ca8a04; }
    .selected-row .remove-btn {
      padding: .2rem .45rem;
      border: 1px solid var(--border);
      border-radius: .25rem;
      background: transparent;
      color: var(--text-3);
      cursor: pointer;
      font-size: .9rem;
    }
    .selected-row .remove-btn:hover { color: var(--danger); border-color: var(--danger); }
  </style>
</head>
<body>

<div class="admin-layout">
  <aside class="admin-sidebar" id="admin-sidebar" aria-label="管理選單"></aside>

  <div class="admin-main">
    <div class="admin-topbar">
      <div class="topbar-breadcrumb"><a href="dashboard.html" data-i18n="common.home">首頁</a><span>/</span><span style="color:var(--text)" data-i18n="nav.map">流浪動物中心</span></div>
      <div class="topbar-actions">
        <a href="../projects/stray-aid-map.html" target="_blank" class="btn btn--outline btn--sm">Stray Aid Map</a>
        <button class="btn btn--primary btn--sm" id="btn-new-loc">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span data-en="New location">新增中心</span>
        </button>
      </div>
    </div>

    <div class="admin-content">
      <div class="panel">
        <div class="panel__header">
          <div class="panel__title" data-en="Shelters, vets &amp; feeding stations">流浪動物收容中心</div>
          <div class="panel__toolbar">
            <div class="search-input">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
              <input type="text" id="search-locs" placeholder="搜尋中心名稱…" data-en-ph="Search by name or address…" />
            </div>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th data-en="Name">名稱</th>
                <th data-en="Address">地址</th>
                <th data-en="Phone">電話</th>
                <th data-en="Food stock">飼料存量</th>
                <th style="text-align:right" data-en="Actions">操作</th>
              </tr>
            </thead>
            <tbody id="locs-tbody"></tbody>
          </table>
        </div>
        <div class="pagination">
          <div id="locs-count" style="color:var(--text-3);font-size:.75rem"></div>
          <div class="pagination__pages" id="locs-pages"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-backdrop" id="loc-modal">
  <div class="modal modal--lg">
    <div class="modal__header">
      <div class="modal__title" id="loc-modal-title">新增中心</div>
      <button class="modal__close" data-close-modal>✕</button>
    </div>
    <div class="modal__body">
      <input type="hidden" id="loc-id" />
      <div class="field-row">
        <div class="field">
          <label class="field-label" data-en="Name (Chinese) *">中文名稱 *</label>
          <input class="field-input" id="l-name" placeholder="臺北市動物之家" required />
        </div>
        <div class="field">
          <label class="field-label" data-en="Name (English)">英文名稱</label>
          <input class="field-input" id="l-name-en" placeholder="Taipei Animal Shelter" />
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label class="field-label" data-en="Address (Chinese)">地址（中）</label>
          <input class="field-input" id="l-address" placeholder="台北市北投區立農街二段350號" />
        </div>
        <div class="field">
          <label class="field-label" data-en="Address (English)">地址（英）</label>
          <input class="field-input" id="l-address-en" placeholder="350 Linong St. Sec.2, Beitou, Taipei" />
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label class="field-label" data-en="Phone">電話</label>
          <input class="field-input" id="l-phone" placeholder="02-2858-3700" />
        </div>
        <div class="field">
          <label class="field-label" data-en="Opening hours (Chinese)">營業時間（中）</label>
          <input class="field-input" id="l-hours" placeholder="週二–週日 09:00–17:00" />
        </div>
      </div>
      <div class="field">
        <label class="field-label" data-en="Opening hours (English)">營業時間（英）</label>
        <input class="field-input" id="l-hours-en" placeholder="Tue–Sun 09:00–17:00" />
      </div>
      <div class="coord-row">
        <div class="field">
          <label class="field-label" data-en="Latitude *">緯度（Lat） *</label>
          <input class="field-input" id="l-lat" placeholder="25.1306" type="number" step="any" min="-90" max="90" oninput="updatePreviewMap()" required />
        </div>
        <div class="field">
          <label class="field-label" data-en="Longitude *">經度（Lng） *</label>
          <input class="field-input" id="l-lng" placeholder="121.4984" type="number" step="any" min="-180" max="180" oninput="updatePreviewMap()" required />
        </div>
        <button type="button" class="btn btn--outline btn--sm geo-btn" id="btn-geocode" data-en="Find coordinates from address">📍 從地址找座標</button>
      </div>
      <div class="field-hint" style="margin:.4rem 0 1rem" data-en="Uses the Chinese address (or the English one if empty). Check the pin on the map.">以中文地址（若空白則用英文地址）查詢，請確認地圖上的位置是否正確。</div>
      <div class="field">
        <label class="field-label" data-en="Map preview">地圖預覽</label>
        <div id="preview-map"></div>
        <div class="field-hint">→ <a href="https://www.google.com/maps" target="_blank" style="color:var(--accent)">Google Maps</a></div>
      </div>

      <div class="field">
        <label class="field-label" data-en="Location type *">地點類型 *</label>
        <select class="field-select" id="l-type" required>
          <option value="shelter">🏠 收容所 Shelter</option>
          <option value="vet">🏥 動物醫院 Vet Clinic</option>
          <option value="feeding_station">🍚 餵食站 Feeding Station</option>
        </select>
        <div class="field-hint" data-en="Food stock is only required for shelters.">「飼料存量」僅收容所需要填寫。</div>
      </div>

      <div class="field">
        <label class="field-label" data-en="Main photo">中心主圖</label>
        <div style="display:flex;gap:1rem;align-items:flex-start">
          <div style="flex:1">
            <input type="file" id="loc-image-input" accept="image/*" style="display:none" />
            <button type="button" class="btn btn--outline btn--sm" onclick="document.getElementById('loc-image-input').click()" data-en="Choose image">選擇圖片</button>
            <div id="loc-image-preview" style="margin-top:.5rem;border-radius:.3rem;overflow:hidden;max-width:200px;max-height:150px"></div>
          </div>
        </div>
        <input type="hidden" id="l-image-url" />
      </div>

      <div class="field">
        <label class="field-label" data-en="Video">中心影片</label>
        <div style="display:flex;gap:1rem;align-items:flex-start">
          <div style="flex:1">
            <input type="file" id="loc-video-input" accept="video/*" style="display:none" />
            <button type="button" class="btn btn--outline btn--sm" onclick="document.getElementById('loc-video-input').click()" data-en="Choose video">選擇影片</button>
            <div id="loc-video-status" style="margin-top:.4rem;font-size:.8rem;color:var(--text-2)"></div>
            <div id="loc-video-preview" style="margin-top:.5rem;border-radius:.3rem;overflow:hidden;max-width:260px"></div>
          </div>
        </div>
        <input type="hidden" id="l-video-url" />
      </div>

      <div class="needs-section">
        <div class="field" id="food-weeks-field">
        <label class="field-label" data-en="Food stock (weeks) * — shelters">飼料存量（週） *（收容所）</label>
        <input class="field-input" id="l-food-weeks" type="number" step="0.1" min="0" placeholder="1.5" />
        <div class="field-error-msg" id="food-weeks-err"></div>
        <div class="field-hint" data-en="Higher = well stocked; 2–4 weeks = low; under 2 weeks = urgent">數字越大 = 糧食充足；2-4週 = 偏低；2週以下 = 緊急缺糧</div>
        </div>

        <label class="field-label" style="margin-top:1.5rem;display:block" data-en="Supplies / funding needed">缺乏物資／資金</label>
        <div style="color:var(--text-3);font-size:.78rem;margin-bottom:.5rem" data-en="① Click the buttons below to add items">① 點選下方按鈕加入物資清單</div>
        <div class="preset-grid" id="preset-buttons"></div>

        <div style="color:var(--text-3);font-size:.78rem;margin-bottom:.5rem" data-en="② Set how badly each is needed (urgent / moderate / slight)">② 在下方清單中選擇缺乏程度（緊急 / 適度 / 微量）</div>
        <div class="selected-list" id="selected-list"></div>

        <label class="field-label" style="margin-top:1.25rem;display:block" data-en="Other needs / notes (free text)">其他物資／說明（自由輸入）</label>
        <textarea class="field-input" id="l-custom-needs" placeholder="例：尋求短期志工支援、醫療器材捐贈…" data-en-ph="e.g. short-term volunteers, medical equipment…" style="min-height:80px;resize:vertical"></textarea>
      </div>
    </div>
    <div class="modal__footer">
      <button class="btn btn--outline" data-close-modal data-i18n="btn.cancel">取消</button>
      <button class="btn btn--primary" id="btn-save-loc" data-i18n="btn.save">儲存</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/admin.js?v=6"></script>
<script>
/* Local bilingual helper (named tr, not L, because L is Leaflet's global). */
function tr(zh, en) { return getLang() === 'en' ? en : zh; }
/* Safe JS string literal for inline onclick="fn(...)" attributes */
function jsArg(v) { return esc(JSON.stringify(String(v ?? ''))); }
/* Only allow http(s) or relative URLs into src/href */
function safeUrl(u) {
  const v = String(u || '').trim();
  if (!v) return '';
  if (/^https?:\/\//i.test(v)) return v;
  if (/^[a-z][a-z0-9+.-]*:/i.test(v) || v.startsWith('//')) return '';
  return v;
}
/* Swap static labels marked with data-en / data-en-ph between zh and en. */
function applyLocalLabels() {
  const en = getLang() === 'en';
  document.querySelectorAll('[data-en]').forEach(el => {
    if (el.dataset.zh === undefined) el.dataset.zh = el.textContent;
    el.textContent = en ? el.dataset.en : el.dataset.zh;
  });
  document.querySelectorAll('[data-en-ph]').forEach(el => {
    if (el.dataset.zhPh === undefined) el.dataset.zhPh = el.getAttribute('placeholder') || '';
    el.setAttribute('placeholder', en ? el.dataset.enPh : el.dataset.zhPh);
  });
  const typeLabels = { shelter: ['🏠 收容所', '🏠 Shelter'], vet: ['🏥 動物醫院', '🏥 Vet clinic'], feeding_station: ['🍚 餵食站', '🍚 Feeding station'] };
  document.querySelectorAll('#l-type option').forEach(o => { const l = typeLabels[o.value]; if (l) o.textContent = en ? l[1] : l[0]; });
  const title = document.getElementById('loc-modal-title');
  title.textContent = document.getElementById('loc-id').value ? tr('編輯中心', 'Edit location') : tr('新增中心', 'New location');
}

let allLocs = [], filteredLocs = [];
const PAGE_SIZE = 10;
let currentPage = 1;
let previewMap, previewMarker;
const LOC_TYPES = ['shelter','vet','feeding_station'];
const onlyLocTypes = list => (list || []).filter(l => !l.type || LOC_TYPES.includes(l.type));

// 預設物資清單（後台 + 前台共用 key 對照）
const PRESET_NEEDS = [
  { key: 'dry_food',   label_zh: '乾飼料',     label_en: 'Dry food' },
  { key: 'canned',     label_zh: '罐頭食品',   label_en: 'Canned food' },
  { key: 'deworming',  label_zh: '驅蟲藥',     label_en: 'Deworming meds' },
  { key: 'medical',    label_zh: '醫療費補助', label_en: 'Medical funding' },
  { key: 'surgery',    label_zh: '手術費補助', label_en: 'Surgery funding' },
  { key: 'neutering',  label_zh: '結紮費',     label_en: 'Neutering funds' },
  { key: 'cleaning',   label_zh: '清潔用品',   label_en: 'Cleaning supplies' },
  { key: 'cages',      label_zh: '籠子',       label_en: 'Cages' },
  { key: 'beds',       label_zh: '寵物床',     label_en: 'Pet beds' },
  { key: 'toys',       label_zh: '玩具',       label_en: 'Toys' },
  { key: 'volunteers', label_zh: '志工',       label_en: 'Volunteers' },
  { key: 'donations',  label_zh: '長期捐款',   label_en: 'Regular donations' }
];

const LEVEL_OPTIONS = [
  { value: 'urgent',   label_zh: '緊急', label_en: 'Urgent' },
  { value: 'moderate', label_zh: '適度', label_en: 'Moderate' },
  { value: 'slight',   label_zh: '微量', label_en: 'Slight' }
];

let currentNeeds = []; // [{ key, level }]

function findPreset(key) {
  return PRESET_NEEDS.find(p => p.key === key);
}
function presetLabel(p) { return getLang() === 'en' ? p.label_en : p.label_zh; }

function markDirty() {
  const m = document.getElementById('loc-modal');
  if (m && m.classList.contains('open')) m.dataset.dirty = '1';
}

function renderPresetButtons() {
  const html = PRESET_NEEDS.map(p => {
    const isSel = currentNeeds.some(n => n.key === p.key);
    return `<button type="button" class="preset-btn${isSel ? ' selected' : ''}" onclick="togglePreset(${jsArg(p.key)})">${isSel ? '' : '<span class="plus">+</span>'}${esc(presetLabel(p))}</button>`;
  }).join('');
  document.getElementById('preset-buttons').innerHTML = html;
}

function renderSelectedList() {
  const list = document.getElementById('selected-list');
  if (!currentNeeds.length) {
    list.innerHTML = `<div class="selected-empty">${esc(tr('尚未選擇任何物資', 'No items selected yet'))}</div>`;
    return;
  }
  list.innerHTML = currentNeeds.map(n => {
    const preset = findPreset(n.key);
    const label = preset ? presetLabel(preset) : n.key;
    const levels = LEVEL_OPTIONS.map(opt => `
      <button type="button" class="level-btn${n.level === opt.value ? ' active ' + opt.value : ''}"
              onclick="setNeedLevel(${jsArg(n.key)}, ${jsArg(opt.value)})">${esc(tr(opt.label_zh, opt.label_en))}</button>
    `).join('');
    return `
      <div class="selected-row">
        <div class="name">${esc(label)}</div>
        <div class="levels">${levels}</div>
        <button type="button" class="remove-btn" onclick="removeNeed(${jsArg(n.key)})" title="${esc(tr('移除', 'Remove'))}">✕</button>
      </div>
    `;
  }).join('');
}

function renderNeedsAll() {
  renderPresetButtons();
  renderSelectedList();
}

function togglePreset(key) {
  const idx = currentNeeds.findIndex(n => n.key === key);
  if (idx === -1) {
    currentNeeds.push({ key, level: 'moderate' });
  } else {
    currentNeeds.splice(idx, 1);
  }
  markDirty();
  renderNeedsAll();
}

function setNeedLevel(key, level) {
  const item = currentNeeds.find(n => n.key === key);
  if (item) item.level = level;
  markDirty();
  renderNeedsAll();
}

function removeNeed(key) {
  currentNeeds = currentNeeds.filter(n => n.key !== key);
  markDirty();
  renderNeedsAll();
}

// 舊版資料相容：把 normal → moderate
function normalizeLevels(needs) {
  if (!Array.isArray(needs)) return [];
  return needs.map(n => ({
    key: n.key,
    level: (n.level === 'normal') ? 'moderate' : (n.level || 'moderate')
  })).filter(n => n.key);
}

function renderTable() {
  const start = (currentPage - 1) * PAGE_SIZE;
  const page  = filteredLocs.slice(start, start + PAGE_SIZE);
  const tbody = document.getElementById('locs-tbody');
  const tEdit = esc(t('btn.edit'));
  const tDel = esc(t('btn.delete'));
  const countEl = document.getElementById('locs-count');

  if (filteredLocs.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5"><div class="empty-state"><div class="empty-state__icon">🏠</div><div class="empty-state__title">${esc(tr('尚無中心', 'No locations yet'))}</div></div></td></tr>`;
    countEl.textContent = '';
    document.getElementById('locs-pages').innerHTML = '';
    return;
  }

  const weeks = tr('週', 'wk');
  tbody.innerHTML = page.map(l => {
    const fw = (l.food_weeks === null || l.food_weeks === undefined || l.food_weeks === '') ? null : Number(l.food_weeks);
    const food = (fw === null || isNaN(fw))
      ? '<span style="color:var(--text-3)">—</span>'
      : `<span style="font-size:.85rem;font-weight:600;color:${fw < 2 ? 'var(--danger)' : fw < 4 ? '#B45309' : '#15803D'}">${esc(fw)} ${esc(weeks)}</span>`;
    return `
    <tr>
      <td><strong>${esc(l.name)}</strong><br><span style="font-size:.75rem;color:var(--text-3)">${esc(l.name_en || '—')}</span></td>
      <td style="font-size:.8rem;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(l.address || '—')}</td>
      <td class="td-mono">${esc(l.phone || '—')}</td>
      <td>${food}</td>
      <td><div class="td-actions">
        <button class="btn btn--ghost btn--sm" onclick="editLoc(${jsArg(l.id)})">${tEdit}</button>
        <button class="btn btn--danger-ghost btn--sm" onclick="deleteLoc(${jsArg(l.id)})">${tDel}</button>
      </div></td>
    </tr>`;
  }).join('');

  countEl.textContent = tr(`${filteredLocs.length} 個中心`, `${filteredLocs.length} locations`);
  const total = Math.ceil(filteredLocs.length / PAGE_SIZE);
  document.getElementById('locs-pages').innerHTML = total <= 1 ? '' :
    Array.from({length:total},(_,i)=>`<button class="page-btn${i+1===currentPage?' active':''}" onclick="goPage(${i+1})">${i+1}</button>`).join('');
}

function goPage(n) { currentPage = n; renderTable(); }

function applyFilter() {
  const q = document.getElementById('search-locs').value.trim().toLowerCase();
  filteredLocs = allLocs.filter(l => {
    const text = !q || [l.name, l.name_en, l.address].some(f => (f||'').toLowerCase().includes(q));
    return text;
  });
  currentPage = 1;
  renderTable();
}

function initPreviewMap() {
  if (previewMap) return;
  previewMap = L.map('preview-map', { zoomControl: true, attributionControl: false });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(previewMap);
  previewMap.setView([23.8, 121.0], 7);
}

function updatePreviewMap() {
  const lat = parseFloat(document.getElementById('l-lat').value);
  const lng = parseFloat(document.getElementById('l-lng').value);
  if (isNaN(lat) || isNaN(lng)) return;
  if (typeof L === 'undefined') return;
  if (!previewMap) initPreviewMap();
  if (previewMarker) previewMarker.setLatLng([lat, lng]);
  else previewMarker = L.marker([lat, lng]).addTo(previewMap);
  previewMap.setView([lat, lng], 15);
}

/* ── Geocode: address → lat/lng via OpenStreetMap Nominatim ── */
async function geocodeAddress() {
  const addr = document.getElementById('l-address').value.trim() || document.getElementById('l-address-en').value.trim();
  if (!addr) { showToast(tr('請先填寫地址', 'Enter an address first'), 'warn'); document.getElementById('l-address').focus(); return; }
  const btn = document.getElementById('btn-geocode');
  btn.disabled = true;
  try {
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=tw&q=' + encodeURIComponent(addr);
    const res = await fetch(url, { headers: { 'Accept-Language': getLang() === 'en' ? 'en' : 'zh-TW' } });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const hit = Array.isArray(data) && data[0];
    const lat = hit ? parseFloat(hit.lat) : NaN, lng = hit ? parseFloat(hit.lon) : NaN;
    if (isNaN(lat) || isNaN(lng)) {
      showToast(tr('找不到這個地址的座標，請改寫地址或手動輸入', 'No coordinates found for this address — try rewording it or enter them by hand'), 'warn');
      return;
    }
    document.getElementById('l-lat').value = lat.toFixed(6);
    document.getElementById('l-lng').value = lng.toFixed(6);
    ['l-lat','l-lng'].forEach(id => document.getElementById(id).closest('.field')?.classList.remove('field--error'));
    markDirty();
    updatePreviewMap();
    showToast(tr('已填入座標，請確認地圖上的位置', 'Coordinates filled in — check the pin on the map'), 'success');
  } catch (err) {
    console.warn('geocode failed', err);
    showToast(tr('查詢座標失敗，請稍後再試或手動輸入', 'Could not look up coordinates — try again later or enter them by hand'), 'error');
  } finally {
    btn.disabled = false;
  }
}

function setImagePreview(url) {
  const u = safeUrl(url);
  document.getElementById('loc-image-preview').innerHTML = u
    ? `<img src="${esc(u)}" alt="" style="width:100%;height:100%;object-fit:cover">` : '';
}
function setVideoPreview(url) {
  const u = safeUrl(url);
  document.getElementById('loc-video-preview').innerHTML = u
    ? `<video src="${esc(u)}" controls preload="metadata" style="width:100%;display:block;background:#000"></video>` : '';
}

function openNewModal() {
  document.getElementById('loc-id').value = '';
  document.getElementById('loc-modal-title').textContent = tr('新增中心', 'New location');
  ['name','name-en','address','address-en','phone','hours','hours-en','lat','lng','food-weeks','custom-needs'].forEach(f => {
    const el = document.getElementById('l-'+f); if (el) el.value = '';
  });
  document.getElementById('l-type').value = 'shelter';
  document.getElementById('l-image-url').value = '';
  setImagePreview('');
  document.getElementById('l-video-url').value = '';
  setVideoPreview('');
  document.getElementById('loc-video-status').textContent = '';
  currentNeeds = [];
  renderNeedsAll();
  openModal('loc-modal');
  setTimeout(() => {
    if (typeof L === 'undefined') return;
    initPreviewMap();
    previewMap.invalidateSize();
    previewMap.setView([23.8, 121.0], 7);
    if (previewMarker) { previewMarker.remove(); previewMarker = null; }
  }, 100);
}

async function editLoc(id) {
  const l = await DB.getById('map_locations', id);
  if (!l) return;
  const v = x => (x === null || x === undefined) ? '' : x;
  document.getElementById('loc-id').value = l.id;
  document.getElementById('loc-modal-title').textContent = tr('編輯中心', 'Edit location');
  document.getElementById('l-name').value = l.name || '';
  document.getElementById('l-name-en').value = l.name_en || '';
  document.getElementById('l-address').value = l.address || '';
  document.getElementById('l-address-en').value = l.address_en || '';
  document.getElementById('l-phone').value = l.phone || '';
  document.getElementById('l-hours').value = l.hours || '';
  document.getElementById('l-hours-en').value = l.hours_en || '';
  document.getElementById('l-lat').value = v(l.lat);
  document.getElementById('l-lng').value = v(l.lng);
  document.getElementById('l-food-weeks').value = v(l.food_weeks);
  document.getElementById('l-type').value = l.type || 'shelter';
  document.getElementById('l-image-url').value = l.image_url || '';
  document.getElementById('l-video-url').value = l.video_url || '';
  document.getElementById('l-custom-needs').value = l.custom_needs || '';
  setImagePreview(l.image_url);
  document.getElementById('loc-video-status').textContent = '';
  setVideoPreview(l.video_url);
  currentNeeds = normalizeLevels(Array.isArray(l.needs) ? JSON.parse(JSON.stringify(l.needs)) : []);
  renderNeedsAll();
  openModal('loc-modal');
  setTimeout(() => {
    if (typeof L === 'undefined') return;
    initPreviewMap();
    previewMap.invalidateSize();
    if (previewMarker) { previewMarker.remove(); previewMarker = null; }
    updatePreviewMap();
  }, 100);
}

async function deleteLoc(id) {
  const l = await DB.getById('map_locations', id);
  if (!l) return;
  confirmAction(t('msg.confirm_del_title'), `「${l.name || l.name_en || id}」 — ${t('msg.confirm_del_text')}`, async () => {
    const ok = await DB.delete('map_locations', id);
    if (!ok) return;
    allLocs = onlyLocTypes(await DB.getAll('map_locations'));
    applyFilter();
    showToast(t('msg.deleted'), 'success');
  });
}

document.getElementById('loc-image-input').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) { showToast(t('msg.upload_invalid'), 'error'); e.target.value = ''; return; }
  showToast(t('msg.uploading'), 'info');
  const url = await uploadToMedia(file, 'map_locations', { maxW: 800, maxH: 600, quality: 0.85 });
  if (url) {
    document.getElementById('l-image-url').value = url;
    setImagePreview(url);
    markDirty();
  }
  e.target.value = '';
});

document.getElementById('loc-video-input').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const statusEl = document.getElementById('loc-video-status');
  if (file.size > 50 * 1024 * 1024) { // ponytail: 50MB ceiling; use a hosted embed if larger
    statusEl.textContent = tr('影片過大（上限 50MB），請壓縮後再上傳。', 'Video too large (50 MB max) — please compress it first.');
    e.target.value = ''; return;
  }
  statusEl.textContent = tr('上傳中…', 'Uploading…');
  const url = await uploadToMedia(file, 'map_locations', { compress: false });
  if (url) {
    document.getElementById('l-video-url').value = url;
    setVideoPreview(url);
    statusEl.textContent = '';
    markDirty();
  } else {
    statusEl.textContent = tr('上傳失敗，請再試一次。', 'Upload failed — please try again.');
  }
  e.target.value = '';
});

/* '' → null, otherwise a finite number (0 stays 0), else NaN */
function numOrNull(id) {
  const raw = document.getElementById(id).value.trim();
  if (raw === '') return null;
  const n = Number(raw);
  return Number.isFinite(n) ? n : NaN;
}
function markFieldError(input, msg) {
  const field = input.closest('.field');
  if (field) {
    field.classList.add('field--error');
    let m = field.querySelector('.field-error-msg');
    if (!m) { m = document.createElement('div'); m.className = 'field-error-msg'; field.appendChild(m); }
    m.textContent = msg;
  }
  input.focus();
}

document.getElementById('btn-save-loc').addEventListener('click', async () => {
  const modal = document.getElementById('loc-modal');
  if (!validateFields(modal)) return;
  const lat = numOrNull('l-lat'), lng = numOrNull('l-lng'), food = numOrNull('l-food-weeks');
  if (lat === null || isNaN(lat) || lat < -90 || lat > 90) {
    markFieldError(document.getElementById('l-lat'), tr('請輸入有效的緯度（-90 到 90）', 'Enter a valid latitude (-90 to 90)'));
    showToast(t('err.fix.fields'), 'warn'); return;
  }
  if (lng === null || isNaN(lng) || lng < -180 || lng > 180) {
    markFieldError(document.getElementById('l-lng'), tr('請輸入有效的經度（-180 到 180）', 'Enter a valid longitude (-180 to 180)'));
    showToast(t('err.fix.fields'), 'warn'); return;
  }
  const type = document.getElementById('l-type').value || 'shelter';
  if (type === 'shelter' && (food === null || isNaN(food) || food < 0)) {
    markFieldError(document.getElementById('l-food-weeks'), tr('收容所需填寫飼料存量（週）', 'Shelters need a food stock value (weeks)'));
    showToast(tr('收容所需填寫飼料存量（週）', 'Shelters need a food stock value (weeks)'), 'warn'); return;
  }
  const id = document.getElementById('loc-id').value || null;
  const data = {
    name:        document.getElementById('l-name').value.trim(),
    name_en:     document.getElementById('l-name-en').value.trim(),
    type:        type,
    status:      'active',
    address:     document.getElementById('l-address').value.trim(),
    address_en:  document.getElementById('l-address-en').value.trim(),
    phone:       document.getElementById('l-phone').value.trim(),
    hours:       document.getElementById('l-hours').value.trim(),
    hours_en:    document.getElementById('l-hours-en').value.trim(),
    lat:         lat,
    lng:         lng,
    image_url:   document.getElementById('l-image-url').value || null,
    video_url:   document.getElementById('l-video-url').value || null,
    food_weeks:  (food === null || isNaN(food)) ? null : food,
    needs:       currentNeeds,
    custom_needs:document.getElementById('l-custom-needs').value.trim() || null
  };
  const btn = document.getElementById('btn-save-loc');
  btn.disabled = true;
  let result = null;
  try {
    result = id
      ? await DB.update('map_locations', id, data)
      : await DB.insert('map_locations', data);
  } finally {
    btn.disabled = false;
  }
  if (!result) return;
  showToast(id ? t('msg.updated') : t('msg.created'), 'success');
  closeModal('loc-modal');
  allLocs = onlyLocTypes(await DB.getAll('map_locations'));
  applyFilter();
});

document.getElementById('btn-new-loc').addEventListener('click', openNewModal);
document.getElementById('btn-geocode').addEventListener('click', geocodeAddress);
document.getElementById('search-locs').addEventListener('input', applyFilter);

document.addEventListener('DOMContentLoaded', async () => {
  applyLocalLabels();
  const user = await Auth.get();
  if (!user) return;
  allLocs = onlyLocTypes(await DB.getAll('map_locations'));
  filteredLocs = allLocs;
  renderTable();
  renderNeedsAll();
  if (new URLSearchParams(location.search).get('action') === 'new') openNewModal();
});
document.addEventListener('admin-lang-changed', () => { applyLocalLabels(); renderTable(); renderNeedsAll(); });
</script>

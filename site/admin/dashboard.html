<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n-title-key="dash.crumb.current">TTT Admin — 儀表板</title>
  <link rel="icon" href="../assets/favicon.png" type="image/png" />
  <link rel="stylesheet" href="css/admin.css?v=5" />
</head>
<body>

<div class="admin-layout">

  <!-- Sidebar -->
  <aside class="admin-sidebar" id="admin-sidebar" aria-label="管理選單"></aside>

  <!-- Main -->
  <div class="admin-main">
    <div class="admin-topbar">
      <div class="topbar-breadcrumb">
        <span data-i18n="common.home">首頁</span>
        <span>/</span>
        <span style="color:var(--text)" data-i18n="dash.crumb.current">儀表板</span>
      </div>
      <div class="topbar-actions">
        <a href="../index.html" target="_blank" class="btn btn--outline btn--sm">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          <span data-i18n="btn.view_site">前台</span>
        </a>
      </div>
    </div>

    <div class="admin-content">
      <h2 data-i18n="dash.title" style="font-size:1.3rem;font-weight:800;letter-spacing:-.02em;margin-bottom:1.5rem">
        總覽
      </h2>

      <!-- Stats -->
      <div class="stats-grid" id="stats-grid">
        <a class="stat-card" href="members.html">
          <div class="stat-card__icon">👥</div>
          <div class="stat-card__value" id="stat-members">—</div>
          <div class="stat-card__label" data-i18n="dash.stat.members">團隊成員</div>
        </a>
        <a class="stat-card" href="projects.html">
          <div class="stat-card__icon">📁</div>
          <div class="stat-card__value" id="stat-projects">—</div>
          <div class="stat-card__label" data-i18n="dash.stat.projects">進行中專案</div>
        </a>
        <a class="stat-card" href="blog.html">
          <div class="stat-card__icon">📝</div>
          <div class="stat-card__value" id="stat-posts">—</div>
          <div class="stat-card__label" data-i18n="dash.stat.posts">已發布文章</div>
        </a>
        <a class="stat-card" href="map-locations.html">
          <div class="stat-card__icon">📍</div>
          <div class="stat-card__value" id="stat-locations">—</div>
          <div class="stat-card__label" data-i18n="dash.stat.locations">地圖資料點</div>
        </a>
      </div>

      <!-- Two-column panels -->
      <div class="dash-grid">

        <!-- Recent activity -->
        <div class="panel">
          <div class="panel__header">
            <div class="panel__title" data-i18n="dash.panel.activity">最新動態</div>
          </div>
          <div id="activity-list"></div>
        </div>

        <!-- Quick actions -->
        <div class="panel">
          <div class="panel__header">
            <div class="panel__title" data-i18n="dash.panel.quick">快速操作</div>
          </div>
          <div style="padding:1.25rem;display:flex;flex-direction:column;gap:.6rem">
            <a href="members.html?action=new" class="btn btn--outline" style="justify-content:flex-start;gap:.75rem">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
              <span data-i18n="dash.qa.new_member">新增團隊成員</span>
            </a>
            <a href="projects.html?action=new" class="btn btn--outline" style="justify-content:flex-start;gap:.75rem">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
              <span data-i18n="dash.qa.new_project">新增專案</span>
            </a>
            <a href="blog.html?action=new" class="btn btn--outline" style="justify-content:flex-start;gap:.75rem">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
              <span data-i18n="dash.qa.new_post">撰寫新文章</span>
            </a>
            <a href="map-locations.html?action=new" class="btn btn--outline" style="justify-content:flex-start;gap:.75rem">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
              <span data-i18n="dash.qa.new_location">新增地圖資料點</span>
            </a>
            <hr style="border-color:var(--border);margin:.25rem 0" />
            <a href="../projects/stray-aid-map.html" target="_blank" class="btn btn--ghost" style="justify-content:flex-start;gap:.75rem;font-size:.78rem">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
              <span data-i18n="dash.qa.preview_map">預覽 Stray Aid Map</span>
            </a>
          </div>
        </div>

      </div>

      <div class="dash-grid" style="margin-top:1rem">
        <!-- To-do -->
        <div class="panel">
          <div class="panel__header"><div class="panel__title" data-i18n="dash.todo.title">待處理事項</div></div>
          <div id="todo-list" class="todo-list"></div>
        </div>

        <!-- Where do I edit…? -->
        <div class="panel">
          <div class="panel__header"><div class="panel__title" data-i18n="dash.map.title">我想改前台的…</div></div>
          <div class="edit-map">
            <a href="settings.html"><span data-i18n="dash.map.home">首頁簡介、使命、三大方向、數字</span><b data-i18n="nav.settings">網站設定</b></a>
            <a href="settings.html#social"><span data-i18n="dash.map.footer">頁尾社群連結、嘖嘖募資連結、Logo</span><b data-i18n="nav.settings">網站設定</b></a>
            <a href="focus.html"><span data-i18n="dash.map.focus">年度主題頁</span><b data-i18n="nav.focus">年度主題</b></a>
            <a href="projects.html"><span data-i18n="dash.map.projects">專案頁的專案卡片</span><b data-i18n="nav.projects">專案管理</b></a>
            <a href="blog.html"><span data-i18n="dash.map.blog">部落格文章</span><b data-i18n="nav.blog">部落格文章</b></a>
            <a href="members.html"><span data-i18n="dash.map.team">團隊頁的成員</span><b data-i18n="nav.members">團隊成員</b></a>
            <a href="categories.html"><span data-i18n="dash.map.cats">專案分類、團隊部門</span><b data-i18n="nav.categories">分類管理</b></a>
            <a href="map-locations.html"><span data-i18n="dash.map.map">浪浪地圖上的收容所與地點</span><b data-i18n="nav.map">地圖資料點</b></a>
            <div class="edit-map__note" data-i18n="dash.map.later">首頁大標題、跑馬燈、首頁專案卡片與「關於我們」頁目前寫在程式裡，下一階段會開放在後台修改。</div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/admin.js?v=6"></script>
<script>
async function renderDashboard() {
  const user = await Auth.get();
  if (!user) return;

  const [members, projects, posts, locations, pending] = await Promise.all([
    DB.getAll('members'),
    DB.getAll('projects'),
    DB.getAll('posts'),
    DB.getAll('map_locations'),
    sb.from('join_applications').select('id', { count: 'exact', head: true }).eq('status', 'pending')
      .then(r => r.count || 0, () => 0),
  ]);

  document.getElementById('stat-members').textContent   = members.filter(m => m.status !== 'alumni').length;
  document.getElementById('stat-projects').textContent  = projects.filter(p => p.status === 'active').length;
  document.getElementById('stat-posts').textContent     = posts.filter(p => p.status === 'published').length;
  document.getElementById('stat-locations').textContent = locations.length;

  /* ── To-do list: things that need a person ── */
  const todos = [
    { n: pending, key: 'dash.todo.apps', href: 'applications.html', tone: 'coral' },
    { n: posts.filter(p => p.status !== 'published').length, key: 'dash.todo.drafts', href: 'blog.html', tone: 'sun' },
    { n: projects.filter(p => !p.title_en || !p.summary_en).length, key: 'dash.todo.proj_en', href: 'projects.html', tone: 'violet' },
    { n: members.filter(m => m.status !== 'alumni' && (!m.name_en || !m.photo)).length, key: 'dash.todo.members', href: 'members.html', tone: 'cyan' },
    { n: locations.filter(l => l.lat == null || l.lng == null || l.lat === '' || l.lng === '').length, key: 'dash.todo.coords', href: 'map-locations.html', tone: 'coral' },
  ].filter(x => x.n > 0);
  const todoEl = document.getElementById('todo-list');
  todoEl.innerHTML = todos.length
    ? todos.map(x => `<a class="todo todo--${x.tone}" href="${x.href}"><span class="todo__n">${esc(x.n)}</span><span>${esc(t(x.key))}</span><span class="todo__go">→</span></a>`).join('')
    : `<div class="todo-empty">🎉 ${esc(t('dash.todo.none'))}</div>`;

  /* ── Recent activity ── */
  const all = [
    ...members.map(r => ({ type: 'member', name: r.name, time: r.updated_at || r.created_at, color: 'var(--accent-2)', href: 'members.html' })),
    ...projects.map(r => ({ type: 'project', name: r.title, time: r.updated_at || r.created_at, color: 'var(--violet)', href: 'projects.html' })),
    ...posts.map(r => ({ type: 'post', name: r.title, time: r.updated_at || r.created_at, color: 'var(--sun)', href: 'blog.html' })),
    ...locations.map(r => ({ type: 'location', name: r.name, time: r.updated_at || r.created_at, color: 'var(--coral)', href: 'map-locations.html' })),
  ].filter(a => a.time).sort((a, b) => new Date(b.time) - new Date(a.time)).slice(0, 8);

  const typeLabel = {
    member: t('dash.type.member'),
    project: t('dash.type.project'),
    post: t('dash.type.post'),
    location: t('dash.type.location')
  };
  const actList = document.getElementById('activity-list');
  if (all.length === 0) {
    actList.innerHTML = `<div style="padding:2rem;text-align:center;color:var(--text-3);font-size:.85rem">${esc(t('dash.activity.empty'))}</div>`;
  } else {
    actList.innerHTML = all.map(a => `
      <a class="activity-item" href="${a.href}">
        <div class="activity-dot" style="background:${a.color}"></div>
        <div>
          <div class="activity-text"><strong>${esc(a.name || '—')}</strong> —— ${esc(typeLabel[a.type])}${esc(t('dash.activity.updated'))}</div>
          <div class="activity-time">${esc(fmtDate(a.time))}</div>
        </div>
      </a>`).join('');
  }
}
document.addEventListener('DOMContentLoaded', renderDashboard);
document.addEventListener('admin-lang-changed', renderDashboard);
</script>
</body>
</html>

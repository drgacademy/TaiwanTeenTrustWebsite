<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n-title-key="nav.members">TTT Admin — 團隊成員</title>
  <link rel="icon" href="../assets/favicon.png" type="image/png" />
  <link rel="stylesheet" href="css/admin.css?v=5" />
  <style>
    .position-opt { display:flex;align-items:center;gap:.65rem;border:1px solid var(--border);border-radius:8px;padding:.65rem .9rem;cursor:pointer;transition:border-color .18s,background .18s;background:var(--surface-2) }
    .position-opt:hover { border-color:var(--border-2) }
    .position-opt.selected { border-color:var(--accent);background:var(--accent-dim) }
    .position-opt input[type=radio] { display:none }
    .position-opt svg { flex-shrink:0;color:var(--text-3);transition:color .18s }
    .position-opt.selected svg { color:var(--accent) }
    .position-opt span { font-size:.85rem;font-weight:500 }
  </style>
</head>
<body>

<div class="admin-layout">

  <!-- Sidebar -->
  <aside class="admin-sidebar" id="admin-sidebar" aria-label="管理選單"></aside>

  <!-- Main -->
  <div class="admin-main">
    <div class="admin-topbar">
      <div class="topbar-breadcrumb">
        <a href="dashboard.html" data-i18n="common.home">首頁</a><span>/</span><span style="color:var(--text)" data-i18n="nav.members">團隊成員</span>
      </div>
      <div class="topbar-actions">
        <button class="btn btn--primary btn--sm" id="btn-new-member">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span data-i18n="members.new">新增成員</span>
        </button>
      </div>
    </div>

    <div class="admin-content">
      <div class="panel">
        <div class="panel__header">
          <div class="panel__title" data-i18n="members.title">所有成員</div>
          <div class="panel__toolbar">
            <div class="search-input">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
              <input type="text" id="search-members" data-i18n-ph="members.search.ph" placeholder="搜尋姓名、部門…" aria-label="搜尋成員" />
            </div>
            <select class="select-input" id="filter-dept">
              <option value="" data-i18n="members.filter.dept">所有部門</option>
            </select>
            <select class="select-input" id="filter-status">
              <option value="" data-i18n="members.filter.status">所有狀態</option>
              <option value="active" data-i18n="members.status.active">現役</option>
              <option value="alumni" data-i18n="members.status.alumni">校友</option>
            </select>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th data-i18n="members.col.name_zh">姓名</th>
                <th data-i18n="members.col.name_en">英文姓名</th>
                <th data-i18n="members.col.dept">部門</th>
                <th id="th-school">學校</th>
                <th data-i18n="members.col.role">職稱</th>
                <th data-i18n="members.col.year">屆別</th>
                <th data-i18n="members.col.status">狀態</th>
                <th data-i18n="members.col.email">電子郵件</th>
                <th style="text-align:right" data-i18n="members.col.actions">操作</th>
              </tr>
            </thead>
            <tbody id="members-tbody"></tbody>
          </table>
        </div>
        <div class="pagination">
          <div id="members-count" style="color:var(--text-3);font-size:.75rem"></div>
          <div class="pagination__pages" id="members-pages"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ── Add/Edit Modal ── -->
<div class="modal-backdrop" id="member-modal">
  <div class="modal">
    <div class="modal__header">
      <div class="modal__title" id="member-modal-title" data-i18n="members.new">新增成員</div>
      <button class="modal__close" data-close-modal>✕</button>
    </div>
    <div class="modal__body">
      <input type="hidden" id="member-id" />

      <!-- Photo upload -->
      <div class="member-photo-row" id="photo-zone">
        <div class="member-avatar-preview" id="avatar-preview">👤</div>
        <div class="member-photo-meta">
          <p data-i18n="members.photo.title">成員大頭照</p>
          <div class="hint" data-i18n="members.photo.hint">建議尺寸 400×400，JPG/PNG，點擊或拖曳上傳</div>
          <div style="margin-top:.6rem;display:flex;gap:.5rem;flex-wrap:wrap">
            <button type="button" class="btn btn--outline btn--sm" id="btn-upload-photo" data-i18n="btn.upload">上傳照片</button>
            <button type="button" class="btn btn--ghost btn--sm" id="btn-clear-photo" style="display:none" data-i18n="btn.remove">移除</button>
          </div>
        </div>
      </div>
      <input type="file" id="photo-file-input" accept="image/*" style="display:none" />

      <div class="field-row">
        <div class="field">
          <label class="field-label" data-i18n="members.f.name_zh">中文姓名 *</label>
          <input class="field-input" id="m-name" placeholder="陳雅婷" required />
        </div>
        <div class="field">
          <label class="field-label" data-i18n="members.f.name_en">英文姓名</label>
          <input class="field-input" id="m-name-en" placeholder="Ya-Ting Chen" />
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label class="field-label" data-i18n="members.f.dept">部門 *</label>
          <select class="field-select" id="m-dept">
            <option value="">—</option>
          </select>
          <div class="field-hint"><a href="categories.html" style="color:var(--accent)">→ 編輯部門項目</a></div>
        </div>
        <div class="field">
          <label class="field-label">學校名稱</label>
          <input class="field-input" id="m-school" placeholder="建國中學 / 北一女中" />
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label class="field-label" data-i18n="members.f.year">屆別</label>
          <input class="field-input" id="m-year" placeholder="2025" />
        </div>
        <div class="field">
          <label class="field-label" data-i18n="members.f.status">狀態</label>
          <select class="field-select" id="m-status">
            <option value="active" data-i18n="members.status.active">現役</option>
            <option value="alumni" data-i18n="members.status.alumni">校友</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label class="field-label" data-i18n="members.f.email">電子郵件</label>
        <input class="field-input" id="m-email" type="email" placeholder="example@example.com" />
      </div>
      <div class="field">
        <label class="field-label">職位</label>
        <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem;margin-top:.25rem" id="m-position-group">
          <label class="position-opt selected">
            <input type="radio" name="m-position" value="" checked />
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span>一般成員</span>
          </label>
          <label class="position-opt">
            <input type="radio" name="m-position" value="president" />
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            <span>社長</span>
          </label>
          <label class="position-opt">
            <input type="radio" name="m-position" value="vice_president" />
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            <span>副社長</span>
          </label>
          <label class="position-opt">
            <input type="radio" name="m-position" value="group_leader" />
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
            <span>組長</span>
          </label>
          <label class="position-opt" style="grid-column:span 2">
            <input type="radio" name="m-position" value="other" />
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
            <span>其他</span>
          </label>
        </div>
        <div id="m-custom-role-wrap" style="display:none;margin-top:.5rem">
          <input class="field-input" id="m-custom-role" required placeholder="輸入自訂職稱，例如：顧問、導師…" />
        </div>
        <div class="field-hint" style="margin-top:.45rem">社長／副社長 顯示於領導核心區；組長 顯示於各組別最左側。每個職位限一人。</div>
      </div>
      <div class="field">
        <label class="field-label" data-i18n="members.f.bio">簡介（中）</label>
        <textarea class="field-textarea" id="m-bio" placeholder="負責…"></textarea>
      </div>
      <div class="field">
        <label class="field-label">簡介（EN）</label>
        <textarea class="field-textarea" id="m-bio-en" placeholder="Handles…"></textarea>
      </div>
    </div>
    <div class="modal__footer">
      <button class="btn btn--outline" data-close-modal data-i18n="btn.cancel">取消</button>
      <button class="btn btn--primary" id="btn-save-member" data-i18n="btn.save">儲存</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/admin.js?v=6"></script>
<script>
/* Small bilingual helper for strings that have no I18N key yet. */
const L = (zh, en) => getLang() === 'en' ? en : zh;
/* Only allow http(s) or relative URLs into src/href. */
function safeUrl(u) {
  const s = String(u || '').trim();
  if (!s) return '';
  if (/^https?:\/\//i.test(s) || /^\/\//.test(s)) return s;
  if (/^[a-z][a-z0-9+.\-]*:/i.test(s)) return '';
  return s;
}

const POSITION_LABEL = {
  president:      () => L('社長', 'President'),
  vice_president: () => L('副社長', 'Vice President'),
  group_leader:   () => L('組長', 'Group Leader'),
};
const POSITION_BADGE = { president: 'badge--gold', vice_president: 'badge--gold', group_leader: 'badge--cyan' };
const POSITION_ICON  = { president: '⭐', vice_president: '🌟', group_leader: '🔹' };

/* ── Position UI helpers ── */
function setPositionUI(value, customText = '') {
  document.querySelectorAll('input[name="m-position"]').forEach(r => {
    r.checked = r.value === value;
    r.closest('.position-opt').classList.toggle('selected', r.value === value);
  });
  const wrap = document.getElementById('m-custom-role-wrap');
  const inp  = document.getElementById('m-custom-role');
  const isOther = value === 'other';
  wrap.style.display = isOther ? 'block' : 'none';
  if (inp) inp.value = isOther ? customText : '';
}

document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('input[name="m-position"]').forEach(r => {
    r.addEventListener('change', () => setPositionUI(r.value));
  });
});

/* ── State ── */
let allMembers = [];
let filteredMembers = [];
let allDepts = [];
const PAGE_SIZE = 10;
let currentPage = 1;
let memberPhoto = null;   // public URL or null

function deptLabel(key) {
  if (!key) return '';
  const d = allDepts.find(x => x.key === key);
  if (!d) return key;
  return (getLang() === 'en' && d.label_en) ? d.label_en : (d.label_zh || key);
}

async function loadDepartments() {
  allDepts = (await DB.getAll('departments') || [])
    .slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
  const filterDept = document.getElementById('filter-dept');
  const formDept   = document.getElementById('m-dept');
  const keepFilter = filterDept.value, keepForm = formDept.value;
  filterDept.innerHTML = `<option value="" data-i18n="members.filter.dept">${esc(t('members.filter.dept'))}</option>` +
    allDepts.map(d => `<option value="${esc(d.key)}">${esc(d.label_zh)}</option>`).join('');
  formDept.innerHTML = `<option value="">—</option>` +
    allDepts.map(d => `<option value="${esc(d.key)}">${esc(d.label_zh)}</option>`).join('');
  filterDept.value = keepFilter; formDept.value = keepForm;
}

/* ── Photo upload wiring ── */
function setAvatarPreview(url) {
  const safe = safeUrl(url);
  memberPhoto = safe || null;
  const el = document.getElementById('avatar-preview');
  el.innerHTML = safe ? `<img src="${esc(safe)}" alt="avatar">` : '👤';
  document.getElementById('btn-clear-photo').style.display = safe ? '' : 'none';
}

async function handlePhotoFiles(files) {
  if (!files || !files[0]) return;
  const url = await uploadToMedia(files[0], 'members', { maxW: 400, maxH: 400, quality: 0.82 });
  if (url) {
    setAvatarPreview(url);
    document.getElementById('member-modal').dataset.dirty = '1';
    showToast(t('msg.saved'), 'success');
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const zone  = document.getElementById('photo-zone');
  const input = document.getElementById('photo-file-input');
  document.getElementById('btn-upload-photo').addEventListener('click', e => { e.stopPropagation(); input.click(); });
  document.getElementById('btn-clear-photo').addEventListener('click', e => {
    e.stopPropagation(); setAvatarPreview(null);
    document.getElementById('member-modal').dataset.dirty = '1';
  });
  bindUploadZone(zone, input, handlePhotoFiles);
});

/* ── Render ── */
function positionCell(m) {
  if (m.position && POSITION_LABEL[m.position]) {
    return `<span class="badge ${POSITION_BADGE[m.position]}">${POSITION_ICON[m.position]} ${esc(POSITION_LABEL[m.position]())}</span>`;
  }
  if (m.role) return esc(m.role);
  return `<span style="color:var(--text-3)">${esc(L('一般成員', 'Member'))}</span>`;
}

function renderTable() {
  const start = (currentPage - 1) * PAGE_SIZE;
  const page  = filteredMembers.slice(start, start + PAGE_SIZE);
  const tbody = document.getElementById('members-tbody');
  document.getElementById('th-school').textContent = L('學校', 'School');
  document.getElementById('members-count').textContent = `${filteredMembers.length}`;

  if (filteredMembers.length === 0) {
    const msg = allMembers.length ? L('沒有符合條件的成員', 'No members match these filters') : L('尚無成員，點右上角「新增成員」開始', 'No members yet — click “New member” to add one');
    tbody.innerHTML = `<tr><td colspan="9"><div class="empty-state"><div class="empty-state__icon">👥</div><div class="empty-state__title">—</div><div class="empty-state__text">${esc(msg)}</div></div></td></tr>`;
    renderPages();
    return;
  }

  const stActive = t('members.status.active');
  const stAlumni = t('members.status.alumni');
  const tEdit = t('btn.edit');
  const tDel  = t('btn.delete');

  tbody.innerHTML = page.map(m => {
    const photo = safeUrl(m.photo);
    return `
    <tr>
      <td class="td-name">
        ${photo
          ? `<img src="${esc(photo)}" alt="" style="width:28px;height:28px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:.5rem;border:1px solid var(--border)">`
          : `<span style="display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--surface-3);font-size:.85rem;vertical-align:middle;margin-right:.5rem">👤</span>`}${esc(m.name)}
      </td>
      <td>${esc(m.name_en || '—')}</td>
      <td>${m.dept ? `<span class="badge badge--cyan">${esc(deptLabel(m.dept))}</span>` : '—'}</td>
      <td>${esc(m.school || '—')}</td>
      <td>${positionCell(m)}</td>
      <td>${esc(m.year || '—')}</td>
      <td><span class="badge ${m.status === 'active' ? 'badge--green' : 'badge--gray'}">${esc(m.status === 'active' ? stActive : stAlumni)}</span></td>
      <td class="td-mono">${esc(m.email || '—')}</td>
      <td>
        <div class="td-actions">
          <button class="btn btn--ghost btn--sm" data-act="edit" data-id="${esc(m.id)}">${esc(tEdit)}</button>
          <button class="btn btn--danger-ghost btn--sm" data-act="delete" data-id="${esc(m.id)}">${esc(tDel)}</button>
        </div>
      </td>
    </tr>`;
  }).join('');

  renderPages();
}

function renderPages() {
  const total = Math.ceil(filteredMembers.length / PAGE_SIZE);
  const pages = document.getElementById('members-pages');
  if (total <= 1) { pages.innerHTML = ''; return; }
  pages.innerHTML = Array.from({length: total}, (_, i) =>
    `<button class="page-btn${i+1===currentPage?' active':''}" data-page="${i+1}">${i+1}</button>`
  ).join('');
}

function goPage(n) { currentPage = n; renderTable(); }

function applyFilter() {
  const q    = document.getElementById('search-members').value.trim().toLowerCase();
  const dept = document.getElementById('filter-dept').value;
  const st   = document.getElementById('filter-status').value;
  filteredMembers = allMembers.filter(m => {
    const posText = m.position && POSITION_LABEL[m.position] ? POSITION_LABEL[m.position]() : '';
    const textMatch = !q || [m.name, m.name_en, m.dept, deptLabel(m.dept), m.role, m.school, m.email, posText]
      .some(f => String(f || '').toLowerCase().includes(q));
    const deptMatch = !dept || m.dept === dept;
    const stMatch   = !st   || m.status === st;
    return textMatch && deptMatch && stMatch;
  });
  currentPage = 1;
  renderTable();
}

async function reloadMembers() {
  allMembers = (await DB.getAll('members')) || [];
  applyFilter();
}

/* ── Form ── */
function openNewModal() {
  document.getElementById('member-id').value = '';
  document.getElementById('member-modal-title').textContent = t('members.new');
  ['name','name_en','year','email','bio','bio_en','school'].forEach(f => {
    const el = document.getElementById('m-' + f.replace('_','-'));
    if (el) el.value = '';
  });
  document.getElementById('m-dept').value = '';
  document.getElementById('m-status').value = 'active';
  setPositionUI('');
  setAvatarPreview(null);
  openModal('member-modal');
}

async function editMember(id) {
  const m = await DB.getById('members', id);
  if (!m) return;
  document.getElementById('member-id').value = m.id;
  document.getElementById('member-modal-title').textContent = t('members.edit');
  document.getElementById('m-name').value     = m.name || '';
  document.getElementById('m-name-en').value  = m.name_en || '';
  document.getElementById('m-dept').value     = m.dept || '';
  document.getElementById('m-year').value     = m.year || '';
  document.getElementById('m-status').value   = m.status || 'active';
  document.getElementById('m-email').value    = m.email || '';
  document.getElementById('m-bio').value      = m.bio || '';
  document.getElementById('m-bio-en').value   = m.bio_en || '';
  document.getElementById('m-school').value   = m.school || '';
  // position=null + role text → select "其他" and fill custom input
  const pos = m.position || '';
  if (!pos && m.role) {
    setPositionUI('other', m.role);
  } else {
    setPositionUI(pos);
  }
  setAvatarPreview(m.photo || null);
  openModal('member-modal');
}

async function deleteMember(id) {
  const m = allMembers.find(x => String(x.id) === String(id)) || await DB.getById('members', id);
  if (!m) return;
  confirmAction(
    L(`刪除成員「${m.name || ''}」？`, `Delete member “${m.name || ''}”?`),
    L(`將永久移除 ${m.name || ''}${m.school ? '（' + m.school + '）' : ''} 的成員資料。`, `${m.name || ''}${m.school ? ' (' + m.school + ')' : ''} will be removed permanently.`) + ' ' + t('msg.confirm_del_text'),
    async () => {
      const ok = await DB.delete('members', id);
      if (!ok) return;
      await reloadMembers();
      showToast(t('msg.deleted'), 'success');
    });
}

document.getElementById('btn-save-member').addEventListener('click', async () => {
  const modal = document.getElementById('member-modal');
  if (!validateFields(modal)) return;
  const id   = document.getElementById('member-id').value || null;
  const _posVal = document.querySelector('input[name="m-position"]:checked')?.value || '';
  const data = {
    name:     document.getElementById('m-name').value.trim(),
    name_en:  document.getElementById('m-name-en').value.trim(),
    dept:     document.getElementById('m-dept').value,
    year:     document.getElementById('m-year').value.trim(),
    status:   document.getElementById('m-status').value,
    email:    document.getElementById('m-email').value.trim(),
    bio:      document.getElementById('m-bio').value.trim(),
    bio_en:   document.getElementById('m-bio-en').value.trim(),
    school:   document.getElementById('m-school').value.trim() || null,
    photo:    memberPhoto || null,
    position: (_posVal && _posVal !== 'other') ? _posVal : null,
    role:     _posVal === 'other' ? (document.getElementById('m-custom-role').value.trim() || null) : null,
    is_lead:  false,
  };

  // Soft check: 社長／副社長 should be held by only one active member.
  if ((data.position === 'president' || data.position === 'vice_president') && data.status === 'active') {
    const holder = allMembers.find(o => String(o.id) !== String(id) && o.position === data.position && o.status === 'active');
    if (holder) {
      const posName = POSITION_LABEL[data.position]();
      showToast(L(`注意：${holder.name} 目前也是${posName}，請確認是否需要調整其職位。`,
                  `Heads up: ${holder.name} is also listed as ${posName}. Update their position if needed.`), 'warn');
    }
  }

  const btn = document.getElementById('btn-save-member');
  btn.disabled = true;
  let result;
  try {
    result = id ? await DB.update('members', id, data) : await DB.insert('members', data);
  } finally {
    btn.disabled = false;
  }
  if (!result) return;
  showToast(id ? t('msg.updated') : t('msg.created'), 'success');
  closeModal('member-modal');
  await reloadMembers();
});

/* ── Event bindings ── */
document.getElementById('btn-new-member').addEventListener('click', openNewModal);
document.getElementById('search-members').addEventListener('input', applyFilter);
document.getElementById('filter-dept').addEventListener('change', applyFilter);
document.getElementById('filter-status').addEventListener('change', applyFilter);
document.getElementById('members-tbody').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  if (b.dataset.act === 'edit') editMember(b.dataset.id);
  else if (b.dataset.act === 'delete') deleteMember(b.dataset.id);
});
document.getElementById('members-pages').addEventListener('click', e => {
  const b = e.target.closest('button[data-page]');
  if (b) goPage(parseInt(b.dataset.page, 10));
});

/* ── Init ── */
document.addEventListener('DOMContentLoaded', async () => {
  const user = await Auth.get();
  if (!user) return;
  await loadDepartments();
  allMembers = (await DB.getAll('members')) || [];
  filteredMembers = allMembers;
  renderTable();

  const params = new URLSearchParams(location.search);
  if (params.get('action') === 'new') openNewModal();
});
document.addEventListener('admin-lang-changed', () => renderTable());
</script>
</body>
</html>

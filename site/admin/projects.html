<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n-title-key="nav.projects">TTT Admin — 專案管理</title>
  <link rel="icon" href="../assets/favicon.png" type="image/png" />
  <link rel="stylesheet" href="css/admin.css?v=5" />
</head>
<body>

<div class="admin-layout">
  <aside class="admin-sidebar" id="admin-sidebar" aria-label="管理選單"></aside>

  <div class="admin-main">
    <div class="admin-topbar">
      <div class="topbar-breadcrumb"><a href="dashboard.html" data-i18n="common.home">首頁</a><span>/</span><span style="color:var(--text)" data-i18n="nav.projects">專案管理</span></div>
      <div class="topbar-actions">
        <button class="btn btn--primary btn--sm" id="btn-new-project">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span data-i18n="projects.new">新增專案</span>
        </button>
      </div>
    </div>

    <div class="admin-content">
      <div class="panel">
        <div class="panel__header">
          <div class="panel__title" data-i18n="projects.title">所有專案</div>
          <div class="panel__toolbar">
            <div class="search-input">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
              <input type="text" id="search-projects" data-i18n-ph="projects.search.ph" placeholder="搜尋專案名稱…" />
            </div>
            <select class="select-input" id="filter-cat">
              <option value="" data-i18n="projects.filter.cat">所有類別</option>
            </select>
            <select class="select-input" id="filter-pstatus">
              <option value="" data-i18n="projects.filter.status">所有狀態</option>
              <option value="active" data-status-label="active">進行中</option>
              <option value="planned" data-status-label="planned">籌備中</option>
              <option value="completed" data-status-label="completed">已完成</option>
            </select>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th data-i18n="projects.col.title">專案名稱</th>
                <th>Slug</th>
                <th data-i18n="projects.col.category">類別</th>
                <th data-i18n="projects.col.status">狀態</th>
                <th>Year</th>
                <th data-i18n="projects.col.updated">最後更新</th>
                <th style="text-align:right" data-i18n="projects.col.actions">操作</th>
              </tr>
            </thead>
            <tbody id="projects-tbody"></tbody>
          </table>
        </div>
        <div class="pagination">
          <div id="projects-count" style="color:var(--text-3);font-size:.75rem"></div>
          <div class="pagination__pages" id="projects-pages"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-backdrop" id="project-modal">
  <div class="modal modal--lg">
    <div class="modal__header">
      <div class="modal__title" id="project-modal-title" data-i18n="projects.new">新增專案</div>
      <button class="modal__close" data-close-modal>✕</button>
    </div>
    <div class="modal__body">
      <input type="hidden" id="project-id" />
      <div class="field-row">
        <div class="field">
          <label class="field-label" data-i18n="projects.f.title_zh">中文名稱 *</label>
          <input class="field-input" id="p-title" placeholder="Stray Aid Map" required />
        </div>
        <div class="field">
          <label class="field-label" data-i18n="projects.f.title_en">英文名稱</label>
          <input class="field-input" id="p-title-en" placeholder="Stray Aid Map" />
        </div>
      </div>
      <div class="field">
        <label class="field-label">Slug</label>
        <input class="field-input" id="p-slug" placeholder="stray-aid-map" data-slug-from="p-title-en,p-title" />
        <div class="field-hint" id="p-slug-hint">依英文名稱自動產生（可手動修改）；小寫英文與連字號</div>
      </div>
      <div class="field-row">
        <div class="field">
          <label class="field-label" data-i18n="projects.f.category">分類 *</label>
          <select class="field-select" id="p-category" required>
            <option value="">—</option>
          </select>
          <div class="field-hint"><a href="categories.html" style="color:var(--accent)" id="p-cat-link">→ 編輯分類項目</a></div>
        </div>
        <div class="field">
          <label class="field-label" data-i18n="projects.f.status">狀態</label>
          <select class="field-select" id="p-status">
            <option value="active" data-status-label="active">進行中</option>
            <option value="planned" data-status-label="planned">籌備中</option>
            <option value="completed" data-status-label="completed">已完成</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label class="field-label">Year</label>
        <input class="field-input" id="p-year" placeholder="2026" />
      </div>
      <div class="field">
        <label class="field-label" data-i18n="projects.f.summary_zh">簡介（中）</label>
        <textarea class="field-textarea" id="p-summary" placeholder="專案簡介…"></textarea>
      </div>
      <div class="field">
        <label class="field-label" data-i18n="projects.f.summary_en">簡介（英）</label>
        <textarea class="field-textarea" id="p-summary-en" placeholder="Project summary…"></textarea>
      </div>

      <!-- 媒體：圖片 -->
      <div class="field">
        <label class="field-label">封面圖片</label>
        <div class="upload-zone" id="p-image-zone" style="border:2px dashed rgba(0,0,0,.2);border-radius:8px;padding:1.5rem;text-align:center;cursor:pointer;transition:all .2s;color:var(--text-2)">
          <div style="font-size:2rem;margin-bottom:.4rem">🖼️</div>
          <div style="font-weight:500">點擊或拖曳上傳圖片</div>
          <div style="font-size:.75rem;color:var(--text-3);margin-top:.4rem">建議尺寸 16:9，JPG/PNG</div>
          <input type="hidden" id="p-image-url" />
        </div>
        <div id="p-image-preview" style="margin-top:.75rem;display:none">
          <img id="p-image-thumb" style="max-width:100%;max-height:180px;border-radius:8px;border:1px solid rgba(0,0,0,.1)" />
          <button type="button" class="btn btn--danger-ghost btn--sm" id="p-image-clear" style="margin-top:.5rem">移除圖片</button>
        </div>
      </div>

      <!-- 媒體：影片 -->
      <div class="field">
        <label class="field-label">封面影片</label>
        <div class="upload-zone" id="p-video-zone" style="border:2px dashed rgba(0,0,0,.2);border-radius:8px;padding:1.5rem;text-align:center;cursor:pointer;transition:all .2s;color:var(--text-2)">
          <div style="font-size:2rem;margin-bottom:.4rem">🎬</div>
          <div style="font-weight:500">點擊或拖曳上傳影片</div>
          <div style="font-size:.75rem;color:var(--text-3);margin-top:.4rem">建議格式 MP4，時長控制在 30 秒內以加快載入</div>
          <input type="hidden" id="p-video-url" />
        </div>
        <div id="p-video-preview" style="margin-top:.75rem;display:none">
          <video id="p-video-thumb" controls style="max-width:100%;max-height:240px;border-radius:8px;border:1px solid rgba(0,0,0,.1)"></video>
          <button type="button" class="btn btn--danger-ghost btn--sm" id="p-video-clear" style="margin-top:.5rem">移除影片</button>
        </div>
        <div class="field-hint" style="margin-top:.5rem;font-size:.75rem;color:var(--text-3)">若同時上傳圖片與影片，前台優先顯示影片。</div>
      </div>

    </div>
    <div class="modal__footer">
      <button class="btn btn--outline" data-close-modal data-i18n="btn.cancel">取消</button>
      <button class="btn btn--primary" id="btn-save-project" data-i18n="btn.save">儲存</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/admin.js?v=6"></script>
<script>
/* Local bilingual helper for strings not (yet) in admin.js I18N */
function L(zh, en) { return getLang() === 'en' ? en : zh; }
/* Safe JS string literal for inline onclick="fn(...)" attributes */
function jsArg(v) { return esc(JSON.stringify(String(v ?? ''))); }
/* Only allow http(s) or relative URLs into src/href */
function safeUrl(u) {
  const v = String(u || '').trim();
  if (!v) return '';
  if (/^https?:\/\//i.test(v)) return v;
  if (/^[a-z][a-z0-9+.-]*:/i.test(v) || v.startsWith('//')) return '';
  return v;
}
/* Status values stay active/planned/completed; the public site shows planned as "coming soon". */
function statusLabel(s) {
  return ({ active: L('進行中', 'Active'), planned: L('籌備中', 'Coming soon'), completed: L('已完成', 'Completed') })[s] || s || '—';
}
function applyStatusLabels() {
  document.querySelectorAll('[data-status-label]').forEach(o => { o.textContent = statusLabel(o.dataset.statusLabel); });
  document.getElementById('p-slug-hint').textContent = L('依英文名稱自動產生（可手動修改）；小寫英文與連字號', 'Fills in automatically from the English name (editable); lowercase-with-hyphens');
  document.getElementById('p-cat-link').textContent = L('→ 編輯分類項目', '→ Edit categories');
}

let allProjects = [], filteredProjects = [];
let allCategories = [];
const PAGE_SIZE = 10;
let currentPage = 1;

async function loadCategories() {
  allCategories = (await DB.getAll('project_categories') || [])
    .slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
  // 填入篩選選單
  const filterCat = document.getElementById('filter-cat');
  const formCat   = document.getElementById('p-category');
  const opts = allCategories.map(c => `<option value="${esc(c.key)}">${esc(c.label_zh)}${c.icon?(' '+esc(c.icon)):''}</option>`).join('');
  filterCat.innerHTML = `<option value="" data-i18n="projects.filter.cat">${esc(t('projects.filter.cat'))}</option>` + opts;
  formCat.innerHTML = `<option value="">—</option>` + opts;
}

function getCatLabel(key) {
  const c = allCategories.find(x => x.key === key);
  return c ? c.label_zh : key;
}

function renderTable() {
  const start = (currentPage - 1) * PAGE_SIZE;
  const page  = filteredProjects.slice(start, start + PAGE_SIZE);
  const tbody = document.getElementById('projects-tbody');

  const STATUS_BADGE = { active:'badge--green', completed:'badge--gray', planned:'badge--gold' };
  const tEdit = esc(t('btn.edit'));
  const tDel = esc(t('btn.delete'));

  if (filteredProjects.length === 0) {
    document.getElementById('projects-count').textContent = '0';
    document.getElementById('projects-pages').innerHTML = '';
    tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state"><div class="empty-state__icon">📁</div><div class="empty-state__title">—</div></div></td></tr>`;
    return;
  }

  tbody.innerHTML = page.map(p => `
    <tr>
      <td class="td-name">${esc(p.title)}</td>
      <td class="td-mono" style="font-size:.72rem;color:var(--text-3)">${esc(p.slug || '—')}</td>
      <td>${p.category ? `<span class="badge badge--cyan">${esc(getCatLabel(p.category))}</span>` : '—'}</td>
      <td><span class="badge ${STATUS_BADGE[p.status]||'badge--gray'}">${esc(statusLabel(p.status))}</span></td>
      <td>${esc(p.year || '—')}</td>
      <td style="color:var(--text-3);font-size:.75rem">${esc(fmtDate(p.updated_at))}</td>
      <td><div class="td-actions">
        <button class="btn btn--ghost btn--sm" onclick="editProject(${jsArg(p.id)})">${tEdit}</button>
        <button class="btn btn--danger-ghost btn--sm" onclick="deleteProject(${jsArg(p.id)})">${tDel}</button>
      </div></td>
    </tr>`).join('');

  document.getElementById('projects-count').textContent = `${filteredProjects.length}`;
  const total = Math.ceil(filteredProjects.length / PAGE_SIZE);
  const pages = document.getElementById('projects-pages');
  pages.innerHTML = total <= 1 ? '' : Array.from({length:total},(_,i)=>
    `<button class="page-btn${i+1===currentPage?' active':''}" onclick="goPage(${i+1})">${i+1}</button>`).join('');
}

function goPage(n) { currentPage = n; renderTable(); }

function applyFilter() {
  const q   = document.getElementById('search-projects').value.trim().toLowerCase();
  const cat = document.getElementById('filter-cat').value;
  const st  = document.getElementById('filter-pstatus').value;
  filteredProjects = allProjects.filter(p => {
    const text = !q || [p.title, p.title_en, p.slug].some(f => (f||'').toLowerCase().includes(q));
    return text && (!cat || p.category === cat) && (!st || p.status === st);
  });
  currentPage = 1;
  renderTable();
}

function setProjectImage(url) {
  document.getElementById('p-image-url').value = url || '';
  const preview = document.getElementById('p-image-preview');
  const zone = document.getElementById('p-image-zone');
  url = safeUrl(url);
  if (url) { document.getElementById('p-image-thumb').src = url; preview.style.display = 'block'; zone.style.opacity = '0.5'; }
  else { preview.style.display = 'none'; zone.style.opacity = '1'; }
}

function setProjectVideo(url) {
  document.getElementById('p-video-url').value = url || '';
  const preview = document.getElementById('p-video-preview');
  const zone = document.getElementById('p-video-zone');
  url = safeUrl(url);
  if (url) { document.getElementById('p-video-thumb').src = url; preview.style.display = 'block'; zone.style.opacity = '0.5'; }
  else { preview.style.display = 'none'; document.getElementById('p-video-thumb').removeAttribute('src'); zone.style.opacity = '1'; }
}

function openNewModal() {
  document.getElementById('project-id').value = '';
  document.getElementById('project-modal-title').textContent = t('projects.new');
  ['title','title-en','slug','year','summary','summary-en'].forEach(f => { const el = document.getElementById('p-'+f); if (el) el.value = ''; });
  document.getElementById('p-category').value = '';
  document.getElementById('p-status').value = 'active';
  setProjectImage('');
  setProjectVideo('');
  openModal('project-modal');
}

async function editProject(id) {
  const p = await DB.getById('projects', id);
  if (!p) return;
  document.getElementById('project-id').value   = p.id;
  document.getElementById('project-modal-title').textContent = t('projects.edit');
  document.getElementById('p-title').value      = p.title || '';
  document.getElementById('p-title-en').value   = p.title_en || '';
  document.getElementById('p-slug').value       = p.slug || '';
  document.getElementById('p-category').value   = p.category || '';
  document.getElementById('p-status').value     = p.status || 'active';
  document.getElementById('p-year').value       = p.year || '';
  document.getElementById('p-summary').value    = p.summary || '';
  document.getElementById('p-summary-en').value = p.summary_en || '';
  setProjectImage(p.image_url || '');
  setProjectVideo(p.video_url || '');
  openModal('project-modal');
}

async function deleteProject(id) {
  const p = await DB.getById('projects', id);
  if (!p) return;
  confirmAction(t('msg.confirm_del_title'), `「${p.title || p.slug || id}」 — ${t('msg.confirm_del_text')}`, async () => {
    const ok = await DB.delete('projects', id);
    if (!ok) return;
    allProjects = await DB.getAll('projects');
    applyFilter();
    showToast(t('msg.deleted'), 'success');
  });
}

document.getElementById('btn-save-project').addEventListener('click', async () => {
  if (!validateFields(document.getElementById('project-modal'))) return;
  const id = document.getElementById('project-id').value || null;
  const data = {
    title:      document.getElementById('p-title').value.trim(),
    title_en:   document.getElementById('p-title-en').value.trim(),
    slug:       document.getElementById('p-slug').value.trim(),
    category:   document.getElementById('p-category').value,
    status:     document.getElementById('p-status').value,
    year:       document.getElementById('p-year').value.trim(),
    summary:    document.getElementById('p-summary').value.trim(),
    summary_en: document.getElementById('p-summary-en').value.trim(),
    image_url:  document.getElementById('p-image-url').value || null,
    video_url:  document.getElementById('p-video-url').value || null,
  };
  const btn = document.getElementById('btn-save-project');
  btn.disabled = true;
  let result = null;
  try {
    result = id
      ? await DB.update('projects', id, data)
      : await DB.insert('projects', data);
  } finally {
    btn.disabled = false;
  }
  if (!result) return;
  showToast(id ? t('msg.updated') : t('msg.created'), 'success');
  closeModal('project-modal');
  allProjects = await DB.getAll('projects');
  applyFilter();
});

document.getElementById('btn-new-project').addEventListener('click', openNewModal);
document.getElementById('search-projects').addEventListener('input', applyFilter);
document.getElementById('filter-cat').addEventListener('change', applyFilter);
document.getElementById('filter-pstatus').addEventListener('change', applyFilter);

function bindProjectMedia() {
  const imgZone  = document.getElementById('p-image-zone');
  const imgInput = document.createElement('input');
  imgInput.type = 'file'; imgInput.accept = 'image/*'; imgInput.style.display = 'none';
  document.body.appendChild(imgInput);
  bindUploadZone(imgZone, imgInput, async files => {
    if (!files.length) return;
    const file = files[0];
    if (!file.type.startsWith('image/')) { showToast(t('msg.upload_invalid'), 'error'); return; }
    showToast(t('msg.uploading'), 'info');
    const url = await uploadToMedia(file, 'projects', { maxW: 1920, maxH: 1080 });
    if (url) setProjectImage(url);
  });
  document.getElementById('p-image-clear').addEventListener('click', e => { e.preventDefault(); setProjectImage(''); });

  const vidZone  = document.getElementById('p-video-zone');
  const vidInput = document.createElement('input');
  vidInput.type = 'file'; vidInput.accept = 'video/*'; vidInput.style.display = 'none';
  document.body.appendChild(vidInput);
  bindUploadZone(vidZone, vidInput, async files => {
    if (!files.length) return;
    const file = files[0];
    if (!file.type.startsWith('video/')) { showToast(L('請選擇影片檔案', 'Please choose a video file'), 'error'); return; }
    showToast(t('msg.uploading'), 'info');
    const url = await uploadToMedia(file, 'projects', { compress:false });
    if (url) setProjectVideo(url);
  });
  document.getElementById('p-video-clear').addEventListener('click', e => { e.preventDefault(); setProjectVideo(''); });
}

document.addEventListener('DOMContentLoaded', async () => {
  applyStatusLabels();
  const user = await Auth.get();
  if (!user) return;
  await loadCategories();
  allProjects = await DB.getAll('projects');
  filteredProjects = allProjects;
  renderTable();
  bindProjectMedia();
  if (new URLSearchParams(location.search).get('action') === 'new') openNewModal();
});
document.addEventListener('admin-lang-changed', () => { applyStatusLabels(); renderTable(); });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n-title-key="nav.users">TTT Admin — 管理員帳號</title>
  <link rel="icon" href="../assets/favicon.png" type="image/png" />
  <link rel="stylesheet" href="css/admin.css?v=5" />
</head>
<body>

<div class="admin-layout">

  <!-- Sidebar -->
  <aside class="admin-sidebar" id="admin-sidebar" aria-label="管理選單"></aside>

  <!-- Main -->
  <div class="admin-main">
    <div class="admin-topbar">
      <div class="topbar-breadcrumb">
        <a href="dashboard.html" data-i18n="common.home">首頁</a><span>/</span><span style="color:var(--text)" data-i18n="users.crumb.current">後台使用者</span>
      </div>
      <div class="topbar-actions">
        <button class="btn btn--primary btn--sm" id="btn-invite-user">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span data-i18n="users.invite">邀請使用者</span>
        </button>
      </div>
    </div>

    <div class="admin-content">
      <div class="panel">
        <div class="panel__header">
          <div>
            <div class="panel__title" data-i18n="users.title">所有後台使用者</div>
            <div style="color:var(--text-3);font-size:.78rem;margin-top:.35rem" data-i18n="users.sub">建立可登入後台的帳號；可以指定角色為管理員或團員。系統會寄發邀請信讓對方設定密碼。</div>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th data-i18n="users.col.email">電子郵件</th>
                <th data-i18n="users.col.name">姓名 / 備註</th>
                <th data-i18n="users.col.role">角色</th>
                <th data-i18n="users.col.created">建立時間</th>
                <th style="text-align:right" data-i18n="users.col.actions">操作</th>
              </tr>
            </thead>
            <tbody id="users-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ── Invite Modal ── -->
<div class="modal-backdrop" id="invite-modal">
  <div class="modal">
    <div class="modal__header">
      <div class="modal__title" data-i18n="users.invite.title">邀請新使用者</div>
      <button class="modal__close" data-close-modal>✕</button>
    </div>
    <div class="modal__body">
      <div style="color:var(--text-3);font-size:.82rem;margin-bottom:1rem" data-i18n="users.invite.hint">系統會寄送含設定密碼連結的邀請信到下方信箱。預設角色為「團員」。</div>
      <div class="field">
        <label class="field-label" data-i18n="users.f.email">電子郵件 *</label>
        <input class="field-input" id="u-email" type="email" data-i18n-ph="users.f.email.ph" placeholder="name@example.com" required />
      </div>
      <div class="field">
        <label class="field-label" data-i18n="users.f.name">姓名 / 備註</label>
        <input class="field-input" id="u-name" data-i18n-ph="users.f.name.ph" placeholder="王小明 / 資訊部部長" />
      </div>
      <div class="field">
        <label class="field-label" data-i18n="users.f.role">角色</label>
        <select class="field-select" id="u-role">
          <option value="member" data-i18n="users.role.member">團員</option>
          <option value="admin" data-i18n="users.role.admin">管理員</option>
        </select>
        <div style="color:var(--text-3);font-size:.72rem;margin-top:.35rem" data-i18n="users.f.role.hint">管理員可管理所有資料；團員僅能編輯部分內容。</div>
      </div>
    </div>
    <div class="modal__footer">
      <button class="btn btn--outline" data-close-modal data-i18n="btn.cancel">取消</button>
      <button class="btn btn--primary" id="btn-send-invite" data-i18n="users.invite">邀請使用者</button>
    </div>
  </div>
</div>

<!-- ── Edit Modal ── -->
<div class="modal-backdrop" id="edit-modal">
  <div class="modal">
    <div class="modal__header">
      <div class="modal__title" data-i18n="users.edit.title">編輯後台使用者</div>
      <button class="modal__close" data-close-modal>✕</button>
    </div>
    <div class="modal__body">
      <input type="hidden" id="e-id" />
      <input type="hidden" id="e-user-id" />
      <div class="field">
        <label class="field-label" data-i18n="users.f.email">電子郵件</label>
        <input class="field-input" id="e-email" type="email" disabled style="opacity:.7;cursor:not-allowed" />
      </div>
      <div class="field">
        <label class="field-label" data-i18n="users.f.name">姓名 / 備註</label>
        <input class="field-input" id="e-name" data-i18n-ph="users.f.name.ph" placeholder="王小明 / 資訊部部長" />
      </div>
      <div class="field">
        <label class="field-label" data-i18n="users.f.role">角色</label>
        <select class="field-select" id="e-role">
          <option value="member" data-i18n="users.role.member">團員</option>
          <option value="admin" data-i18n="users.role.admin">管理員</option>
        </select>
        <div style="color:var(--text-3);font-size:.72rem;margin-top:.35rem" data-i18n="users.f.role.hint">管理員可管理所有資料；團員僅能編輯部分內容。</div>
      </div>
      <div class="field" style="margin-top:1.5rem;padding-top:1.25rem;border-top:1px solid var(--border)">
        <label class="field-label" data-i18n="users.password.title">密碼管理</label>
        <div style="color:var(--text-3);font-size:.78rem;margin-bottom:.75rem" data-i18n="users.password.hint">直接在此設定新密碼，或寄送密碼重設信讓使用者自行設定。</div>
        <div style="display:grid;gap:.75rem;margin-bottom:1rem">
          <div>
            <label style="display:block;font-size:.8rem;color:var(--text-2);margin-bottom:.35rem" data-i18n="users.f.password">新密碼</label>
            <input class="field-input" id="e-password" type="password" minlength="10" autocomplete="new-password" data-i18n-ph="users.f.password.ph" placeholder="輸入新密碼（至少 10 個字元）" />
            <div class="field-hint" id="e-password-hint" style="margin-top:.3rem">至少 10 個字元</div>
          </div>
          <div>
            <label style="display:block;font-size:.8rem;color:var(--text-2);margin-bottom:.35rem" data-i18n="users.f.password.confirm">確認密碼</label>
            <input class="field-input" id="e-password-confirm" type="password" minlength="10" autocomplete="new-password" data-i18n-ph="users.f.password.confirm.ph" placeholder="確認密碼" />
          </div>
          <button type="button" class="btn btn--primary btn--sm" id="btn-set-password" data-i18n="users.password.set">直接設定密碼</button>
        </div>
        <div style="padding-top:.75rem;border-top:1px solid var(--border)">
          <button type="button" class="btn btn--outline btn--sm" id="btn-reset-password" data-i18n="users.password.reset">寄送密碼重設信</button>
        </div>
      </div>
    </div>
    <div class="modal__footer">
      <button class="btn btn--outline" data-close-modal data-i18n="btn.cancel">取消</button>
      <button class="btn btn--primary" id="btn-save-edit" data-i18n="btn.save">儲存</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/admin.js?v=6"></script>
<script>
/* Local bilingual helper for strings not (yet) in admin.js I18N */
function L(zh, en) { return getLang() === 'en' ? en : zh; }
/* Safe JS string literal for inline onclick="fn(...)" attributes */
function jsArg(v) { return esc(JSON.stringify(String(v ?? ''))); }
const PASSWORD_MIN = 10;
function applyLocalLabels() {
  document.getElementById('e-password-hint').textContent = L(`至少 ${PASSWORD_MIN} 個字元`, `At least ${PASSWORD_MIN} characters`);
}

let adminList = [];
let currentUserId = null;

function fmtCreated(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  const lang = getLang();
  return d.toLocaleDateString(lang === 'en' ? 'en-US' : 'zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit' });
}

function renderTable() {
  const tbody = document.getElementById('users-tbody');
  if (!adminList.length) {
    tbody.innerHTML = `<tr><td colspan="5"><div class="empty-state"><div class="empty-state__icon">👤</div><div class="empty-state__title">${esc(t('users.empty.title'))}</div><div class="empty-state__text">${esc(t('users.empty.text'))}</div></div></td></tr>`;
    return;
  }
  const tRemove = esc(t('btn.delete'));
  const tEdit = esc(t('users.edit'));
  const tRoleAdmin = esc(t('users.role.admin'));
  const tRoleMember = esc(t('users.role.member'));
  const tYou = esc(t('users.badge.you'));

  tbody.innerHTML = adminList.map(u => {
    const isSelf = u.user_id && u.user_id === currentUserId;
    const youBadge = isSelf ? ` <span class="badge badge--cyan" style="margin-left:.35rem">${tYou}</span>` : '';
    const role = u.role || 'member';
    const roleBadge = role === 'admin'
      ? `<span class="badge badge--green">${tRoleAdmin}</span>`
      : `<span class="badge badge--gray">${tRoleMember}</span>`;
    const editBtn = `<button class="btn btn--ghost btn--sm" onclick="openEditModal(${jsArg(u.id)})">${tEdit}</button>`;
    const removeBtn = isSelf
      ? ''
      : `<button class="btn btn--danger-ghost btn--sm" onclick="removeAdmin(${jsArg(u.id)})">${tRemove}</button>`;
    return `
      <tr>
        <td class="td-mono">${esc(u.email || '—')}${youBadge}</td>
        <td>${u.name ? esc(u.name) : '—'}</td>
        <td>${roleBadge}</td>
        <td>${esc(fmtCreated(u.created_at))}</td>
        <td style="text-align:right"><div class="td-actions" style="justify-content:flex-end;gap:.4rem">${editBtn}${removeBtn}</div></td>
      </tr>`;
  }).join('');
}

async function loadAdmins() {
  const { ok, list, error } = await Admins.list();
  if (!ok) {
    showToast(t('msg.load_fail') + (error ? ' – ' + error : ''), 'error');
    return;
  }
  adminList = list;
  renderTable();
}

function openInviteModal() {
  document.getElementById('u-email').value = '';
  document.getElementById('u-name').value = '';
  document.getElementById('u-role').value = 'member';
  openModal('invite-modal');
  setTimeout(() => document.getElementById('u-email').focus(), 50);
}

function openEditModal(id) {
  const u = adminList.find(a => String(a.id) === String(id));
  if (!u) return;
  document.getElementById('e-id').value    = u.id;
  document.getElementById('e-user-id').value = u.user_id || '';
  document.getElementById('e-email').value = u.email || '';
  document.getElementById('e-name').value  = u.name || '';
  document.getElementById('e-role').value  = u.role || 'member';
  document.getElementById('e-password').value = '';
  document.getElementById('e-password-confirm').value = '';
  openModal('edit-modal');
}

document.getElementById('btn-invite-user').addEventListener('click', openInviteModal);

document.getElementById('btn-send-invite').addEventListener('click', async () => {
  const email = document.getElementById('u-email').value.trim();
  const name  = document.getElementById('u-name').value.trim();
  const role  = document.getElementById('u-role').value || 'member';
  if (!email) { showToast(t('users.msg.email_required'), 'error'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showToast(t('users.msg.email_invalid'), 'error'); return; }

  const btn = document.getElementById('btn-send-invite');
  btn.disabled = true;
  const { ok, error } = await Admins.invite(email, name, role);
  btn.disabled = false;

  if (!ok) {
    showToast(t('users.msg.invite_fail') + (error ? ' – ' + error : ''), 'error');
    return;
  }
  showToast(t('users.msg.invited'), 'success');
  closeModal('invite-modal');
  await loadAdmins();
});

document.getElementById('btn-save-edit').addEventListener('click', async () => {
  const id   = document.getElementById('e-id').value;
  const name = document.getElementById('e-name').value.trim();
  const role = document.getElementById('e-role').value || 'member';
  if (!id) return;
  const btn = document.getElementById('btn-save-edit');
  btn.disabled = true;
  const { ok, error } = await Admins.update(id, { name, role });
  btn.disabled = false;
  if (!ok) {
    showToast(t('msg.save_fail') + (error ? ' – ' + error : ''), 'error');
    return;
  }
  showToast(t('users.msg.updated'), 'success');
  closeModal('edit-modal');
  await loadAdmins();
});

document.getElementById('btn-set-password').addEventListener('click', async () => {
  const userId = document.getElementById('e-user-id').value;
  const password = document.getElementById('e-password').value;
  const passwordConfirm = document.getElementById('e-password-confirm').value;

  if (!userId) { showToast(t('users.msg.password_set_fail'), 'error'); return; }
  if (!password) { showToast(t('users.msg.password_required'), 'error'); return; }
  // Message inline: admin.js's zh string for users.msg.password_too_short still says 6
  if (password.length < PASSWORD_MIN) { showToast(L(`密碼至少需要 ${PASSWORD_MIN} 個字元`, `Password must be at least ${PASSWORD_MIN} characters`), 'error'); return; }
  if (password !== passwordConfirm) { showToast(t('users.msg.password_mismatch'), 'error'); return; }

  const btn = document.getElementById('btn-set-password');
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = t('users.password.setting');
  const { ok, error } = await Admins.setPassword(userId, password);
  btn.disabled = false;
  btn.textContent = original;

  if (!ok) {
    showToast(t('users.msg.password_set_fail') + (error ? ' – ' + error : ''), 'error');
    return;
  }
  showToast(t('users.msg.password_set'), 'success');
  document.getElementById('e-password').value = '';
  document.getElementById('e-password-confirm').value = '';
});

document.getElementById('btn-reset-password').addEventListener('click', async () => {
  const email = document.getElementById('e-email').value.trim();
  if (!email) return;
  const btn = document.getElementById('btn-reset-password');
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = t('users.password.resetting');
  const { ok, error } = await Admins.resetPassword(email);
  btn.disabled = false;
  btn.textContent = original;
  if (!ok) {
    showToast(t('users.msg.password_fail') + (error ? ' – ' + error : ''), 'error');
    return;
  }
  showToast(t('users.msg.password_sent'), 'success');
});

async function removeAdmin(id) {
  const admin = adminList.find(a => String(a.id) === String(id));
  if (!admin) return;
  if (admin.user_id === currentUserId) { showToast(t('users.msg.self_remove'), 'error'); return; }

  confirmAction(t('users.remove.title'), `${admin.email} — ${t('users.remove.text')}`, async () => {
    const { ok, error } = await Admins.remove(id);
    if (!ok) { showToast(t('msg.save_fail') + (error ? ' – ' + error : ''), 'error'); return; }
    showToast(t('users.msg.removed'), 'success');
    await loadAdmins();
  });
}

document.addEventListener('DOMContentLoaded', async () => {
  applyLocalLabels();
  const user = await Auth.get();
  if (!user) return;
  currentUserId = user.id;

  // Guard: only admins may access this page
  const { data: adminRow } = await sb.from('admin_users')
    .select('role')
    .eq('user_id', user.id)
    .single();
  if (!adminRow || adminRow.role !== 'admin') {
    window.location.href = 'dashboard.html';
    return;
  }

  await loadAdmins();
});
document.addEventListener('admin-lang-changed', () => { applyLocalLabels(); renderTable(); });
</script>
</body>
</html>

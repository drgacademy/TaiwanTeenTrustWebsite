<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n-title-key="nav.categories">TTT Admin — 分類管理</title>
  <link rel="icon" href="../assets/favicon.png" type="image/png" />
  <link rel="stylesheet" href="css/admin.css?v=5" />
</head>
<body>

<div class="admin-layout">
  <aside class="admin-sidebar" id="admin-sidebar" aria-label="管理選單"></aside>

  <div class="admin-main">
    <div class="admin-topbar">
      <div class="topbar-breadcrumb"><a href="dashboard.html" data-i18n="common.home">首頁</a><span>/</span><span style="color:var(--text)" data-i18n="nav.categories">分類管理</span></div>
    </div>

    <div class="admin-content">
      <!-- 專案分類 -->
      <div class="panel" style="margin-bottom:1.5rem">
        <div class="panel__header">
          <div class="panel__title">📁 <span data-i18n="cats.proj.title">專案分類</span></div>
          <button class="btn btn--primary btn--sm" id="btn-new-cat">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span data-i18n="cats.proj.new">新增分類</span>
          </button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width:60px" data-i18n="cats.col.icon">圖示</th>
                <th data-i18n="cats.col.key">識別碼 (key)</th>
                <th data-i18n="cats.col.label_zh">中文名稱</th>
                <th data-i18n="cats.col.label_en">英文名稱</th>
                <th data-i18n="cats.col.color">顏色</th>
                <th style="width:120px" data-i18n="cats.col.order">排序</th>
                <th style="text-align:right" data-i18n="cats.col.actions">操作</th>
              </tr>
            </thead>
            <tbody id="cats-tbody"></tbody>
          </table>
        </div>
      </div>

      <!-- 團隊部門 -->
      <div class="panel">
        <div class="panel__header">
          <div class="panel__title">👥 <span data-i18n="cats.dept.title">團隊部門</span></div>
          <button class="btn btn--primary btn--sm" id="btn-new-dept">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span data-i18n="cats.dept.new">新增部門</span>
          </button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width:60px" data-i18n="cats.col.icon">圖示</th>
                <th data-i18n="cats.col.key">識別碼 (key)</th>
                <th data-i18n="cats.col.label_zh">中文名稱</th>
                <th data-i18n="cats.col.label_en">英文名稱</th>
                <th data-i18n="cats.col.color">顏色</th>
                <th style="width:120px" data-i18n="cats.col.order">排序</th>
                <th style="text-align:right" data-i18n="cats.col.actions">操作</th>
              </tr>
            </thead>
            <tbody id="depts-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal: 編輯/新增分類項目（共用） -->
<div class="modal-backdrop" id="cat-modal">
  <div class="modal">
    <div class="modal__header">
      <div class="modal__title" id="cat-modal-title">新增分類</div>
      <button class="modal__close" data-close-modal>✕</button>
    </div>
    <div class="modal__body">
      <input type="hidden" id="cat-id" />
      <input type="hidden" id="cat-table" />
      <div class="field-row">
        <div class="field">
          <label class="field-label" data-i18n="cats.f.key">識別碼 (key) *</label>
          <input class="field-input" id="cat-key" placeholder="animals" required data-slug-from="cat-label-en" autocomplete="off" />
          <div class="field-hint" data-i18n="cats.f.key_hint">小寫英文，建立後不建議變更</div>
        </div>
        <div class="field">
          <label class="field-label" data-i18n="cats.f.icon">圖示 (emoji)</label>
          <input class="field-input" id="cat-icon" placeholder="🐾" />
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label class="field-label" data-i18n="cats.f.label_zh">中文名稱 *</label>
          <input class="field-input" id="cat-label-zh" placeholder="動物" required />
        </div>
        <div class="field">
          <label class="field-label" data-i18n="cats.f.label_en">英文名稱</label>
          <input class="field-input" id="cat-label-en" placeholder="Animals" />
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label class="field-label" data-i18n="cats.f.color">顏色 (HEX)</label>
          <input class="field-input" id="cat-color" type="color" value="#00c95d" style="height:42px" />
        </div>
        <div class="field">
          <label class="field-label" data-i18n="cats.f.order">排序</label>
          <input class="field-input" id="cat-order" type="number" placeholder="1" />
        </div>
      </div>
    </div>
    <div class="modal__footer">
      <button class="btn btn--outline" data-close-modal data-i18n="btn.cancel">取消</button>
      <button class="btn btn--primary" id="btn-save-cat" data-i18n="btn.save">儲存</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/admin.js?v=6"></script>
<script>
const L = (zh, en) => getLang() === 'en' ? en : zh;
const HEX_RE = /^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$/;
let allCats = [], allDepts = [];
let reordering = false;

const TABLES = {
  project_categories: { tbody: 'cats-tbody',  list: () => allCats },
  departments:        { tbody: 'depts-tbody', list: () => allDepts },
};

function renderRows(items, tbodyId, table) {
  const tbody = document.getElementById(tbodyId);
  if (!items.length) {
    tbody.innerHTML = `<tr><td colspan="7"><div class="empty-state"><div class="empty-state__icon">📁</div><div class="empty-state__title">—</div></div></td></tr>`;
    return;
  }
  const tEdit = esc(t('btn.edit')), tDel = esc(t('btn.delete'));
  const tUp = esc(L('上移', 'Move up')), tDown = esc(L('下移', 'Move down'));
  const last = items.length - 1;
  tbody.innerHTML = items.map((c, i) => {
    const color = HEX_RE.test(c.color || '') ? c.color : '';
    return `
    <tr>
      <td style="font-size:1.4rem">${esc(c.icon || '—')}</td>
      <td class="td-mono" style="font-size:.78rem">${esc(c.key)}</td>
      <td>${esc(c.label_zh)}</td>
      <td>${esc(c.label_en || '—')}</td>
      <td>${color ? `<span style="display:inline-flex;align-items:center;gap:.4rem"><span style="width:14px;height:14px;border-radius:3px;background:${esc(color)};border:1px solid var(--border-2)"></span><span class="td-mono" style="font-size:.72rem">${esc(color)}</span></span>` : (c.color ? `<span class="td-mono" style="font-size:.72rem">${esc(c.color)}</span>` : '—')}</td>
      <td><div style="display:flex;align-items:center;gap:.25rem;white-space:nowrap">
        <button class="btn btn--ghost btn--sm" style="padding:.15rem .4rem;min-width:0" data-act="up" data-table="${table}" data-idx="${i}" title="${tUp}" aria-label="${tUp}" ${i === 0 ? 'disabled' : ''}>▲</button>
        <button class="btn btn--ghost btn--sm" style="padding:.15rem .4rem;min-width:0" data-act="down" data-table="${table}" data-idx="${i}" title="${tDown}" aria-label="${tDown}" ${i === last ? 'disabled' : ''}>▼</button>
        <span class="td-mono" style="font-size:.75rem;color:var(--text-3);margin-left:.2rem">${esc(c.sort_order || 0)}</span>
      </div></td>
      <td><div class="td-actions">
        <button class="btn btn--ghost btn--sm" data-act="edit" data-table="${table}" data-id="${esc(c.id)}">${tEdit}</button>
        <button class="btn btn--danger-ghost btn--sm" data-act="delete" data-table="${table}" data-id="${esc(c.id)}">${tDel}</button>
      </div></td>
    </tr>`;
  }).join('');
}

function renderAll() {
  renderRows(allCats,  'cats-tbody',  'project_categories');
  renderRows(allDepts, 'depts-tbody', 'departments');
}

async function loadAll() {
  const [cats, depts] = await Promise.all([
    DB.getAll('project_categories'),
    DB.getAll('departments'),
  ]);
  allCats  = (cats  || []).slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
  allDepts = (depts || []).slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
  renderAll();
}

/* Swap a row with its neighbour. If the two share the same sort_order
   (e.g. both 0), renumber the list 1..n first so the swap means something. */
async function moveRow(table, idx, dir) {
  if (reordering) return;
  const items = TABLES[table].list();
  const j = idx + dir;
  if (j < 0 || j >= items.length) return;
  reordering = true;
  try {
    const orders = items.map(c => c.sort_order || 0);
    const hasDupes = new Set(orders).size !== orders.length;
    const target = hasDupes ? items.map((_, k) => k + 1) : orders.slice();
    [target[idx], target[j]] = [target[j], target[idx]];
    const changes = items.map((c, k) => ({ c, order: target[k] })).filter(x => (x.c.sort_order || 0) !== x.order);
    for (const { c, order } of changes) {
      const ok = await DB.update(table, c.id, { sort_order: order });
      if (!ok) { await loadAll(); return; }
      c.sort_order = order;
    }
    items.sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
    renderAll();
    showToast(t('msg.updated'), 'success');
  } finally {
    reordering = false;
  }
}

function openNewModal(table) {
  document.getElementById('cat-id').value = '';
  document.getElementById('cat-table').value = table;
  document.getElementById('cat-modal-title').textContent =
    table === 'project_categories' ? t('cats.proj.new') : t('cats.dept.new');
  ['key','icon','label-zh','label-en','order'].forEach(f => {
    const el = document.getElementById('cat-'+f);
    if (el) el.value = '';
  });
  // default new rows to the end of the list
  const list = TABLES[table].list();
  document.getElementById('cat-order').value = list.length ? Math.max(...list.map(c => c.sort_order || 0)) + 1 : 1;
  document.getElementById('cat-color').value = '#0099ff';
  openModal('cat-modal');
}

window.editCat = async function(table, id) {
  const c = await DB.getById(table, id);
  if (!c) return;
  document.getElementById('cat-id').value = c.id;
  document.getElementById('cat-table').value = table;
  document.getElementById('cat-modal-title').textContent = t('btn.edit') + ' — ' + (c.label_zh||'');
  document.getElementById('cat-key').value      = c.key || '';
  document.getElementById('cat-icon').value     = c.icon || '';
  document.getElementById('cat-label-zh').value = c.label_zh || '';
  document.getElementById('cat-label-en').value = c.label_en || '';
  document.getElementById('cat-color').value    = /^#[0-9a-fA-F]{6}$/.test(c.color || '') ? c.color : '#0099ff';
  document.getElementById('cat-order').value    = c.sort_order || '';
  openModal('cat-modal');
};

window.deleteCat = async function(table, id) {
  const c = TABLES[table].list().find(x => String(x.id) === String(id)) || await DB.getById(table, id);
  if (!c) return;
  const kind = table === 'project_categories' ? L('專案分類', 'project category') : L('部門', 'department');
  const name = `${c.label_zh || ''}${c.key ? ' (' + c.key + ')' : ''}`;
  const note = table === 'project_categories'
    ? L('已使用此分類的專案將不再顯示分類。', 'Projects using it will lose their category.')
    : L('屬於此部門的成員將不再顯示部門。', 'Members in it will lose their department.');
  confirmAction(
    L(`刪除${kind}「${name}」？`, `Delete ${kind} “${name}”?`),
    `${note} ${t('msg.confirm_del_text')}`,
    async () => {
      const ok = await DB.delete(table, id);
      if (!ok) return;
      showToast(t('msg.deleted'), 'success');
      loadAll();
    });
};

document.getElementById('btn-new-cat').addEventListener('click', () => openNewModal('project_categories'));
document.getElementById('btn-new-dept').addEventListener('click', () => openNewModal('departments'));

['cats-tbody', 'depts-tbody'].forEach(tb => document.getElementById(tb).addEventListener('click', e => {
  const b = e.target.closest('button[data-act]');
  if (!b || b.disabled) return;
  const { act, table, id, idx } = b.dataset;
  if (act === 'edit') editCat(table, id);
  else if (act === 'delete') deleteCat(table, id);
  else if (act === 'up') moveRow(table, parseInt(idx, 10), -1);
  else if (act === 'down') moveRow(table, parseInt(idx, 10), 1);
}));

document.getElementById('btn-save-cat').addEventListener('click', async () => {
  const modal = document.getElementById('cat-modal');
  if (!validateFields(modal)) return;
  const id    = document.getElementById('cat-id').value || null;
  const table = document.getElementById('cat-table').value;
  const data = {
    key:        document.getElementById('cat-key').value.trim(),
    icon:       document.getElementById('cat-icon').value.trim() || null,
    label_zh:   document.getElementById('cat-label-zh').value.trim(),
    label_en:   document.getElementById('cat-label-en').value.trim() || null,
    color:      document.getElementById('cat-color').value || null,
    sort_order: parseInt(document.getElementById('cat-order').value) || 0,
  };
  const dupe = TABLES[table].list().find(c => c.key === data.key && String(c.id) !== String(id));
  if (dupe) {
    const field = document.getElementById('cat-key').closest('.field');
    field.classList.add('field--error');
    showToast(L(`識別碼「${data.key}」已被「${dupe.label_zh}」使用`, `Key “${data.key}” is already used by “${dupe.label_zh}”`), 'error');
    document.getElementById('cat-key').focus();
    return;
  }
  const btn = document.getElementById('btn-save-cat');
  btn.disabled = true;
  let result;
  try {
    result = id ? await DB.update(table, id, data) : await DB.insert(table, data);
  } finally {
    btn.disabled = false;
  }
  if (!result) return;
  showToast(id ? t('msg.updated') : t('msg.created'), 'success');
  closeModal('cat-modal');
  loadAll();
});

document.addEventListener('DOMContentLoaded', async () => {
  const user = await Auth.get();
  if (!user) return;
  loadAll();
});
document.addEventListener('admin-lang-changed', () => renderAll());
</script>
</body>
</html>
